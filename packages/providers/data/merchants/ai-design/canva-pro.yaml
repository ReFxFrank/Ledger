slug: canva-pro
name: Canva Pro
legalName: Canva Pty Ltd
category: design
domains:
  - canva.com
aliases:
  - Canva
  - Canva Teams
  - Canva for Teams
descriptorPatterns:
  - CANVA
  - CANVA PRO
  - CANVA.COM
  - CANVA PTY LTD
typicalIntervals:
  - unit: month
    count: 1
  - unit: year
    count: 1
notes: >-
  Canva pushes the annual plan hard at signup and again inside the cancellation flow, where an
  annual subscriber is offered a pause rather than an exit. Team plans bill per member, so the
  amount moves when people are added — a changed amount is not by itself a price rise.
playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    cancelUrl: https://www.canva.com/settings/billing-and-plans
    steps:
      - text: Sign in at canva.com and click your account picture in the top right, then Settings.
      - text: Open Billing & plans (labelled Payments on some accounts) and click Cancel plan on the subscription.
      - text: Click Continue cancellation, choose a reason, then Continue cancellation again.
        warning: There are three confirmations after the first click; stopping at the reason screen leaves the plan renewing.
      - text: Click Cancel subscription on the final screen.
      - text: Wait for the cancellation email — Canva sends one only when the plan has actually ended.
    noticePeriodDays: 0
    refundPolicy: >-
      Canva states that cancelling stops future payments and paid features stay available until
      the end of the current billing period; the unused part is not returned.
    retentionOfferNotes: >-
      Annual subscribers are offered a pause instead of a cancellation, in the position where the
      confirm button normally sits. A paused plan is still a live subscription and resumes on its
      own.
    gotchas:
      - The pause option is presented where the cancel button is expected — pausing keeps the subscription and its renewal date.
      - The flow needs three separate confirmations after the initial Cancel plan click.
      - A plan bought through the App Store or Google Play is not listed in Canva's billing settings.
      - On Canva Teams only the owner or billing contact sees the cancel control; other members can only leave the team.
      - Designs made with Pro elements stay in the account but lose the paid assets once the plan ends.
    evidenceHint: Screenshot the Billing & plans page showing the plan ending, and keep the cancellation email Canva sends.
    sourceUrl: https://www.canva.com/help/cancel-canva-plan/
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad open Settings, tap your name at the top, then tap Subscriptions.
      - text: Tap Canva, then Cancel Subscription and confirm.
        detail: On a Mac, open the App Store, click your name at the bottom left, then Account Settings, then Manage next to Subscriptions.
      - text: Check the entry now reads Expires rather than Renews.
    noticePeriodDays: 0
    gotchas:
      - canva.com shows an Apple-billed plan without a cancel control, because Apple holds the payment method.
      - Deleting the Canva app leaves the Apple subscription running.
      - Refunds for an Apple-billed period are requested from Apple, not from Canva.
    evidenceHint: Screenshot the Subscriptions screen showing Canva with an expiry date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: Open the Google Play Store app and tap your profile icon in the top right.
      - text: Tap Payments & subscriptions, then Subscriptions, then Canva.
      - text: Tap Cancel subscription, choose a reason and confirm.
    noticePeriodDays: 0
    gotchas:
      - Uninstalling the app does not stop Google Play billing.
      - Pro features stay available to the end of the period already paid for.
      - Only the Google account that made the purchase can see the subscription in this list.
    evidenceHint: Screenshot the Play subscription entry showing the cancelled state and end date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
