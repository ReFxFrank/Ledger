typicalIntervals:
  - unit: month
    count: 1
  - unit: month
    count: 6
  - unit: month
    count: 12
notes: >-
  Tinder sells 1, 6 and 12 month terms, and the longer ones renew as a single large charge that
  looks nothing like the monthly price advertised. Where the subscription was bought decides
  where it can be ended, and Tinder's own help pages say deleting the account does not cancel
  the subscription — that combination is the most common way people keep paying for an app they
  no longer have.
playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    steps:
      - text: Sign in at tinder.com in a browser using the same phone number or email as the app.
      - text: Open Settings from the profile menu, then the Manage Payment Account or Subscription section.
      - text: Choose Cancel Subscription and confirm on the following screen.
        detail: >-
          If the page shows no subscription at all, the purchase was made through the App Store or
          Google Play and has to be ended there.
      - text: Reopen the page and check that it shows the date the paid features end.
    noticePeriodDays: 1
    refundPolicy: >-
      Tinder states that cancelling does not refund payments already taken and that a cancelled
      term is not prorated; the features stay usable for the days already paid for.
    retentionOfferNotes: >-
      Offers a discounted renewal or a downgrade to a cheaper tier before the cancellation
      completes.
    gotchas:
      - Deleting the Tinder account or the app does not cancel the subscription, and Tinder says so explicitly.
      - A 6 or 12 month term renews as one large charge on its anniversary, which is easy to mistake for a fraudulent transaction.
      - Boosts and Super Likes bought as one-off packs are separate purchases and are not affected either way.
    evidenceHint: Screenshot the subscription page showing the end date, and keep any confirmation email.
    sourceUrl: https://www.help.tinder.com/hc/en-us/articles/115003554466-Cancel-your-subscription
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the top of the screen.
      - text: Tap Subscriptions, then tap Tinder.
      - text: Tap Cancel Subscription and confirm.
        warning: If no Cancel button appears, the subscription is already set to expire on the date shown.
    noticePeriodDays: 1
    refundPolicy: Apple decides refunds for App Store purchases; Tinder cannot reverse or refund an Apple charge.
    gotchas:
      - Deleting the Tinder account leaves an App Store subscription running and still billing.
      - The subscription belongs to the Apple Account that bought it, which may not be the one on the phone today.
    evidenceHint: Screenshot the App Store Subscriptions screen showing the expiry date.
    sourceUrl: https://www.help.tinder.com/hc/en-us/articles/115003554466-Cancel-your-subscription
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: Open the Google Play Store app and tap your profile icon at the top right.
      - text: Tap Payments & subscriptions, then Subscriptions, then Tinder.
      - text: Tap Cancel subscription, choose a reason, and confirm.
    noticePeriodDays: 1
    gotchas:
      - Uninstalling the app leaves the Google Play subscription running.
      - Deleting the Tinder account does not cancel a subscription that Google Play bills.
    evidenceHint: Screenshot the Play subscription page showing the expiry date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
