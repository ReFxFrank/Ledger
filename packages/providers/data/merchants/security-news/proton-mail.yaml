slug: proton-mail
name: Proton Mail
legalName: Proton AG
category: security_vpn
domains:
  - proton.me
  - protonmail.com
aliases:
  - ProtonMail
  - Proton Mail Plus
  - Proton Unlimited
  - Proton Drive
descriptorPatterns:
  - PROTON MAIL
  - PROTONMAIL
  - PROTONMAIL.COM
  - PROTON.ME
  - PROTON AG
typicalIntervals:
  - unit: month
    count: 1
  - unit: year
    count: 1
  - unit: year
    count: 2
notes: >-
  One Proton Account pays for Mail, Drive, Calendar, Pass and VPN, so a single charge can cover
  several products and the descriptor often says only Proton. The VPN-specific descriptors are
  registered under proton-vpn. Downgrading to Proton Free is the destructive part of this
  cancellation, not the billing.
playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    cancelUrl: https://account.proton.me/dashboard
    steps:
      - text: >-
          Before anything else, check how much mail and Drive storage the account uses. Proton
          Free is far smaller, and the plan drops to it on the day the paid period ends.
        detail: >-
          Storage is shown at the bottom of the left sidebar in Proton Mail and on the Dashboard
          in the account settings.
      - text: Sign in at account.proton.me and open the Dashboard, then the Subscription panel.
      - text: Choose Cancel subscription under the plan and confirm the reason screen.
        warning: >-
          The panel offers a cheaper paid plan alongside the cancel option. Taking it keeps a
          charge running.
      - text: Reload the Dashboard and check it now says the plan ends on a date.
      - text: >-
          Before that date, export anything held only in Proton using the Import-Export app or
          the Download all option in settings.
    noticePeriodDays: 0
    refundPolicy: >-
      Proton charges the full term up front and does not credit the unused part from the
      dashboard; anything of that kind goes through the support form.
    retentionOfferNotes: The exit screen offers a downgrade to a lower paid tier before the cancel completes.
    gotchas:
      - On Proton Free, addresses on a custom domain stop receiving mail and extra addresses are disabled, so mail sent to them can bounce.
      - If stored data is over the Free limit when the plan ends, sending is blocked until enough is deleted.
      - A Proton Unlimited or Duo plan cancels Mail, Drive, Pass, Calendar and VPN together.
      - Cancelling the plan does not delete the account; the account stays on Free until it is closed separately.
      - If the plan was paid with PayPal, check paypal.com under Payments, then Automatic payments, for a leftover Proton agreement.
    evidenceHint: >-
      Screenshot the Subscription panel showing the end date, and keep the export confirmation if
      data was downloaded.
    sourceUrl: https://proton.me/support/cancel-subscription
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap the Proton Mail entry.
        detail: >-
          The entry may be listed as Proton Mail or as the plan name, for example Proton
          Unlimited, depending on what was bought in the app.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
        detail: If the only button offered is Resubscribe, the subscription is already set to expire.
      - text: Note the expiry date shown under the entry.
    noticePeriodDays: 0
    gotchas:
      - Deleting the app leaves the billing running.
      - account.proton.me cannot cancel an Apple-billed plan and shows it as managed elsewhere.
      - The drop to Proton Free still happens on the expiry date, so export data before then.
    evidenceHint: Screenshot the Subscriptions screen showing the Proton entry expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: >-
          Open the Google Play Store app, tap your profile picture, then Payments and
          subscriptions, then Subscriptions.
      - text: Tap the Proton Mail entry, then Cancel subscription, and pick a reason when prompted.
      - text: Continue to the end until the entry shows an expiry date instead of a renewal date.
    noticePeriodDays: 0
    gotchas:
      - The subscription belongs to the Google account that bought it, which may not be the one signed in on the phone now.
      - Uninstalling the app leaves the subscription running.
      - The drop to Proton Free still happens on the expiry date, so export data before then.
    evidenceHint: Screenshot the Play subscriptions entry showing the expiry date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
