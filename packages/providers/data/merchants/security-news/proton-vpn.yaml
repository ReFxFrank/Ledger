slug: proton-vpn
name: Proton VPN
legalName: Proton AG
category: security_vpn
domains:
  - protonvpn.com
aliases:
  - ProtonVPN
  - Proton VPN Plus
descriptorPatterns:
  - PROTONVPN
  - PROTONVPN.COM
  - PROTON VPN
typicalIntervals:
  - unit: month
    count: 1
  - unit: year
    count: 1
  - unit: year
    count: 2
notes: >-
  Proton bills every product from one Proton Account, so a charge may read as Proton rather than
  Proton VPN; the generic Proton descriptors are registered under proton-mail. Cancelling does
  not close the account, it drops it to Proton Free at the end of the paid period, and Proton
  Free still includes VPN on a small set of servers.
playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    cancelUrl: https://account.proton.me/dashboard
    steps:
      - text: >-
          Sign in at account.proton.me. This is the Proton Account, not the VPN app, and it is
          the only place the plan can be changed.
      - text: Open the Dashboard, then the Subscription panel, and read the renewal date and amount.
        detail: >-
          If the panel says the subscription is managed by Apple or Google, Proton is not taking
          the payment and the button below will be absent.
      - text: Choose Cancel subscription under the plan and confirm the reason screen.
        warning: >-
          The panel also offers a downgrade to a cheaper paid tier, which keeps a charge running.
          Cancel subscription is the option that ends the billing.
      - text: >-
          Reload the Dashboard and check the panel now says the plan ends on a date and the
          account moves to Proton Free.
    noticePeriodDays: 0
    refundPolicy: >-
      Proton bills the whole term up front. Where a refund is offered on a recently started plan
      it is arranged through the support form rather than from the dashboard.
    retentionOfferNotes: >-
      The exit screen suggests switching to a cheaper Proton plan before completing the
      cancellation.
    gotchas:
      - The paid plan keeps working to the end of the period already paid for; the drop to Free happens then, not at once.
      - Proton Free limits which countries and servers are reachable and drops the higher speed and Secure Core options.
      - A bundle such as Proton Unlimited cancels VPN, Mail, Drive and Pass together in one action.
      - If the plan was paid with PayPal, check paypal.com under Payments, then Automatic payments, for a leftover Proton agreement.
    evidenceHint: Screenshot the Subscription panel showing the plan ending on a date.
    sourceUrl: https://proton.me/support/cancel-subscription
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap Proton VPN.
        detail: >-
          On a Mac, open App Store, click your name at the bottom left, then Account Settings,
          then Manage next to Subscriptions.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
        detail: If the only button offered is Resubscribe, the subscription is already set to expire.
      - text: Note the expiry date shown under the Proton VPN entry.
    noticePeriodDays: 0
    gotchas:
      - Deleting the app leaves the billing running.
      - account.proton.me cannot cancel an Apple-billed plan and shows it as managed elsewhere.
      - An Apple-billed Proton plan also cannot be upgraded or switched from the website; the store owns the plan.
    evidenceHint: Screenshot the Subscriptions screen showing Proton VPN expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: >-
          Open the Google Play Store app, tap your profile picture, then Payments and
          subscriptions, then Subscriptions.
      - text: Tap Proton VPN, then Cancel subscription, and pick a reason when prompted.
      - text: Continue to the end until the entry shows an expiry date instead of a renewal date.
    noticePeriodDays: 0
    gotchas:
      - The subscription belongs to the Google account that bought it, which may not be the one signed in on the phone now.
      - Uninstalling the app leaves the subscription running.
      - account.proton.me cannot stop a Play-billed plan.
    evidenceHint: Screenshot the Play subscriptions entry showing the expiry date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
