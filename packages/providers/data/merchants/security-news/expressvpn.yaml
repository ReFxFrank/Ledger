slug: expressvpn
name: ExpressVPN
category: security_vpn
domains:
  - expressvpn.com
aliases:
  - Express VPN
  - ExpressVPN Advanced Protection
descriptorPatterns:
  - EXPRESSVPN
  - EXPRESSVPN.COM
  - EXPRESS VPN
  - EXPRESSVPN INTERNATIONAL
typicalIntervals:
  - unit: month
    count: 1
  - unit: month
    count: 6
  - unit: year
    count: 1
  - unit: year
    count: 2
notes: >-
  ExpressVPN sells 1-month, 6-month, 12-month and 2-year terms and adds bonus months to the
  longer ones, so the gap between the first charge and the renewal is often 15 months rather
  than 12. The renewal is at the standard rate, not the discounted first-term rate.
playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    cancelUrl: https://www.expressvpn.com/subscriptions
    steps:
      - text: >-
          Sign in at expressvpn.com/sign-in with the email on the account. If you only have the
          activation code, use the Get Started link in the welcome email to reach the same page.
      - text: Open Subscriptions from the account menu and find the active plan.
        detail: >-
          The plan panel names the payment method and the next billing date. A plan paid through
          an app store says so here and has no cancel control.
      - text: >-
          Choose Turn off automatic renewal, then confirm. The wording on the confirmation is
          about ending renewal rather than ending the subscription.
        warning: >-
          The confirmation step offers to keep the plan at a discount. Leaving the page there
          keeps automatic renewal on.
      - text: >-
          Reload the Subscriptions page and check it now says the subscription expires on a date
          rather than renews on a date.
      - text: >-
          For a refund rather than just an end date, open the 24/7 live chat from the support
          page and ask for the money-back request to be raised on the order.
    noticePeriodDays: 0
    refundPolicy: >-
      ExpressVPN advertises a 30-day money-back window on plans bought from its site, requested
      through live chat. Turning off automatic renewal on its own does not start a refund.
    retentionOfferNotes: >-
      The cancel flow offers extra free months or a lower renewal price before it will complete.
    gotchas:
      - The VPN keeps working to the end of the paid term; switching renewal off changes nothing before then.
      - Bonus months added to a long plan push the renewal date well past the anniversary of the first charge.
      - A plan bought in the iPhone or Android app is billed by the store and cannot be stopped from expressvpn.com.
      - If the plan was paid with PayPal, check paypal.com under Payments, then Automatic payments, for a leftover ExpressVPN agreement.
    evidenceHint: >-
      Screenshot the Subscriptions page showing the expiry date, and save the chat transcript if
      support handled the cancellation.
    sourceUrl: https://www.expressvpn.com/support/troubleshooting/cancel-expressvpn-subscription/
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap ExpressVPN.
        detail: >-
          On a Mac, open App Store, click your name at the bottom left, then Account Settings,
          then Manage next to Subscriptions.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
        detail: If the only button offered is Resubscribe, the subscription is already set to expire.
      - text: Note the expiry date shown under the ExpressVPN entry.
    noticePeriodDays: 0
    gotchas:
      - Deleting the app leaves the billing running.
      - ExpressVPN support cannot stop an Apple-billed plan and will send you back to the App Store.
      - Refunds for Apple-billed plans go through reportaproblem.apple.com.
    evidenceHint: Screenshot the Subscriptions screen showing ExpressVPN expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: >-
          Open the Google Play Store app, tap your profile picture, then Payments and
          subscriptions, then Subscriptions.
      - text: Tap ExpressVPN, then Cancel subscription, and pick a reason when prompted.
      - text: Continue to the end until the entry shows an expiry date instead of a renewal date.
    noticePeriodDays: 0
    gotchas:
      - The subscription belongs to the Google account that bought it, which may not be the one signed in on the phone now.
      - Uninstalling the app leaves the subscription running.
      - ExpressVPN support cannot stop a Play-billed plan.
    evidenceHint: Screenshot the Play subscriptions entry showing the expiry date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
