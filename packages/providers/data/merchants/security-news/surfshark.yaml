slug: surfshark
name: Surfshark
legalName: Surfshark B.V.
category: security_vpn
domains:
  - surfshark.com
aliases:
  - Surfshark VPN
  - Surfshark One
  - Surfshark Starter
descriptorPatterns:
  - SURFSHARK
  - SURFSHARK.COM
  - SURFSHARK LIMITED
  - SURFSHARK B.V.
typicalIntervals:
  - unit: month
    count: 1
  - unit: year
    count: 1
  - unit: year
    count: 2
notes: >-
  Surfshark's headline price is a 24-month term billed in one payment, so the charge repeats
  every two years at a much higher standard rate. Surfshark One and One+ bundle Antivirus,
  Alert and Search into the same single charge; there is no way to drop only part of the bundle.
playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    cancelUrl: https://my.surfshark.com/account/subscription
    steps:
      - text: Sign in at my.surfshark.com with the email on the account.
      - text: Open Account, then Subscription, and read the renewal date and amount on the plan card.
      - text: Choose Cancel subscription under the plan.
        detail: >-
          The control sits below the plan summary, under the payment method, not in the Settings
          area of the VPN app.
      - text: >-
          Work through the retention screens until the plan card says the subscription ends on a
          date.
        warning: >-
          Each retention screen highlights a keep-my-plan button and puts continue-cancelling in
          smaller text. Stopping on any of them leaves the renewal active.
    noticePeriodDays: 0
    refundPolicy: >-
      Surfshark advertises a 30-day money-back window on purchases from its own site, requested
      through the live chat on the support page. Cancelling the renewal does not itself start a
      refund.
    retentionOfferNotes: >-
      The flow offers a discounted extension, then a shorter cheaper plan, before it will
      complete the cancellation.
    gotchas:
      - Access runs to the end of the term already paid for, which on a 24-month plan can be a long way off.
      - Cancelling a Surfshark One bundle stops Antivirus, Alert and Search at the same time.
      - A plan bought in the iPhone or Android app is billed by the store and cannot be stopped from my.surfshark.com.
      - If the plan was paid with PayPal, check paypal.com under Payments, then Automatic payments, for a leftover Surfshark agreement.
    evidenceHint: Screenshot the Subscription page showing the end date, and keep the confirmation email.
    sourceUrl: https://support.surfshark.com/hc/en-us/search?query=cancel%20subscription
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap Surfshark.
        detail: >-
          On a Mac, open App Store, click your name at the bottom left, then Account Settings,
          then Manage next to Subscriptions.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
        detail: If the only button offered is Resubscribe, the subscription is already set to expire.
      - text: Note the expiry date shown under the Surfshark entry.
    noticePeriodDays: 0
    gotchas:
      - Deleting the app leaves the billing running.
      - my.surfshark.com shows an Apple-billed plan as managed elsewhere and has no cancel button for it.
      - Refunds for Apple-billed plans go through reportaproblem.apple.com.
    evidenceHint: Screenshot the Subscriptions screen showing Surfshark expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: >-
          Open the Google Play Store app, tap your profile picture, then Payments and
          subscriptions, then Subscriptions.
      - text: Tap Surfshark, then Cancel subscription, and pick a reason when prompted.
      - text: Continue to the end until the entry shows an expiry date instead of a renewal date.
    noticePeriodDays: 0
    gotchas:
      - The subscription belongs to the Google account that bought it, which may not be the one signed in on the phone now.
      - Uninstalling the app leaves the subscription running.
      - my.surfshark.com cannot stop a Play-billed plan.
    evidenceHint: Screenshot the Play subscriptions entry showing the expiry date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
