typicalIntervals:
  - unit: week
    count: 4
  - unit: month
    count: 1
  - unit: year
    count: 1
notes: >-
  Most New York Times digital plans bill every four weeks rather than monthly, which means
  thirteen charges a year and a date that walks earlier through the calendar. Games, Cooking,
  Wirecutter and The Athletic are sold as separate subscriptions on the same account, so one
  household can carry several NYT charges that each need cancelling on their own. The Athletic
  is registered separately as the-athletic.
playbooks:
  - channel: direct
    method: chat
    difficulty: 3
    phone: "1-800-698-4637"
    hours: Mon-Fri 7am-10pm ET, Sat-Sun 7am-7pm ET
    cancelUrl: https://myaccount.nytimes.com/seg/subscription
    steps:
      - text: >-
          Sign in at nytimes.com and open myaccount.nytimes.com. Every subscription on the
          account is listed there with its own price and next billing date.
      - text: >-
          Pick the subscription that matches the charge, then choose Cancel subscription under
          it.
        detail: >-
          Games and Cooking have their own entries. Cancelling the news subscription leaves the
          others billing exactly as before.
      - text: >-
          Follow the cancellation flow. For many plans it hands over to a live chat window with
          an agent rather than finishing on the page.
        warning: >-
          The chat is the cancellation. Closing the window before the agent confirms an end date
          leaves the subscription running.
      - text: >-
          Tell the agent plainly that you want to cancel, decline the discounted rates, and ask
          for the date access ends and a confirmation email.
      - text: >-
          If the chat is outside its hours, call the subscriber number and ask for cancellations,
          or come back when chat is open rather than leaving the request half finished.
      - text: >-
          A few days later, check myaccount.nytimes.com again and confirm the subscription shows
          an end date rather than a next charge.
    noticePeriodDays: 0
    refundPolicy: >-
      The New York Times bills in advance and access continues to the end of the period already
      paid for; part-periods are not credited on digital plans.
    retentionOfferNotes: >-
      Agents work through a scripted ladder of offers, typically a low four-week rate for six to
      twelve months. Accepting starts a new term at that rate and the step-up to the standard
      price follows automatically when it ends.
    gotchas:
      - Billing is every four weeks on most plans, so the charge that looks monthly arrives thirteen times a year.
      - The introductory rate steps up to the standard rate automatically at the end of the promotional period, with no second confirmation.
      - Games, Cooking and Wirecutter are separate subscriptions and cancelling the news plan does not stop them.
      - A subscription bought in the iOS or Android app is billed by the store, and the account page says so instead of offering a cancel link.
      - Home delivery of the print paper is handled by a different flow and stops at the end of the current delivery period.
    evidenceHint: >-
      Ask the chat agent to email the transcript, and keep the confirmation email that names the
      last day of access.
    sourceUrl: https://help.nytimes.com/hc/en-us/search?query=cancel%20subscription
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap the NYTimes entry, which may read NYTimes, NYT Cooking or NYT Games.
        detail: >-
          On a Mac, open App Store, click your name at the bottom left, then Account Settings,
          then Manage next to Subscriptions.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
        detail: If the only button offered is Resubscribe, the subscription is already set to expire.
      - text: Note the expiry date shown under the entry.
    noticePeriodDays: 0
    gotchas:
      - Deleting the app leaves the billing running.
      - The New York Times cannot cancel an Apple-billed subscription; its own account page shows the plan as managed by Apple.
      - Each NYT app product bought through Apple is a separate entry in the Subscriptions list.
    evidenceHint: Screenshot the Subscriptions screen showing the NYTimes entry expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: >-
          Open the Google Play Store app, tap your profile picture, then Payments and
          subscriptions, then Subscriptions.
      - text: Tap the NYTimes entry, then Cancel subscription, and pick a reason when prompted.
      - text: Continue to the end until the entry shows an expiry date instead of a renewal date.
    noticePeriodDays: 0
    gotchas:
      - The subscription belongs to the Google account that bought it, which may not be the one signed in on the phone now.
      - Uninstalling the app leaves the subscription running.
      - The New York Times cannot stop a Play-billed subscription.
    evidenceHint: Screenshot the Play subscriptions entry showing the expiry date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
