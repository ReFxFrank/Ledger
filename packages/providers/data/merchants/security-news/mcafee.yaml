typicalIntervals:
  - unit: year
    count: 1
  - unit: month
    count: 1
  - unit: year
    count: 2
notes: >-
  McAfee arrives pre-installed on many Windows laptops as a trial that converts into an annual
  subscription, so the first charge often has no memorable purchase behind it. Automatic renewal
  is on by default, the payment is taken before the term ends, and the renewal is at the list
  price rather than the first-year offer.
playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    cancelUrl: https://home.mcafee.com/
    steps:
      - text: >-
          Sign in at home.mcafee.com with the email on the subscription. If the account was
          created by a pre-installed trial, use the password reset on that email address.
      - text: Open My Account, then Subscriptions, and find the plan matching the charge.
      - text: Open Auto-Renewal Settings and switch auto-renewal off for that subscription.
        detail: >-
          The setting is a per-subscription toggle inside the subscription details, not a single
          account-wide switch, so a household with two McAfee plans has two toggles.
      - text: Confirm on the screen that follows and wait for the status to read as off.
        warning: >-
          The confirmation screen offers a discounted renewal instead. Leaving the page there
          leaves auto-renewal on.
      - text: >-
          To stop a charge that has already been taken, use the cancel and refund request in the
          same subscription panel, or the support chat, and quote the order number from the
          receipt email.
    noticePeriodDays: 0
    refundPolicy: >-
      McAfee describes a 30-day money-back window on annual subscriptions, counted from the
      charge, and a shorter one on monthly plans. The request is made through the account panel
      or support rather than being applied when auto-renewal is switched off.
    retentionOfferNotes: >-
      The flow offers a discounted renewal, then a cheaper plan tier, before it will complete.
    gotchas:
      - The renewal payment is taken before the current term ends, so acting on the expiry date is already too late.
      - Switching auto-renewal off does not refund a charge already taken.
      - Uninstalling McAfee from the computer leaves the subscription and its renewal running.
      - A subscription bought through a mobile app store is billed by that store and cannot be stopped from home.mcafee.com.
      - Identity protection and VPN add-ons can sit on the same account as separate subscriptions with their own toggles.
    evidenceHint: >-
      Screenshot the Auto-Renewal Settings page showing the subscription set to off, and keep the
      confirmation email.
    sourceUrl: https://www.mcafee.com/support/
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap the McAfee entry, usually listed as McAfee Security.
        detail: >-
          On a Mac, open App Store, click your name at the bottom left, then Account Settings,
          then Manage next to Subscriptions.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
        detail: If the only button offered is Resubscribe, the subscription is already set to expire.
      - text: Note the expiry date shown under the McAfee entry.
    noticePeriodDays: 0
    gotchas:
      - Deleting the app leaves the billing running.
      - home.mcafee.com cannot cancel an Apple-billed subscription and support will send you back to the App Store.
      - Refunds for Apple-billed plans go through reportaproblem.apple.com.
    evidenceHint: Screenshot the Subscriptions screen showing McAfee expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: >-
          Open the Google Play Store app, tap your profile picture, then Payments and
          subscriptions, then Subscriptions.
      - text: Tap the McAfee Security entry, then Cancel subscription, and pick a reason when prompted.
      - text: Continue to the end until the entry shows an expiry date instead of a renewal date.
    noticePeriodDays: 0
    gotchas:
      - The subscription belongs to the Google account that bought it, which may not be the one signed in on the phone now.
      - Uninstalling the app leaves the subscription running.
      - home.mcafee.com cannot stop a Play-billed subscription.
    evidenceHint: Screenshot the Play subscriptions entry showing the expiry date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
