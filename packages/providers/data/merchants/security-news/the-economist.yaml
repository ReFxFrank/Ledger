slug: the-economist
name: The Economist
legalName: The Economist Newspaper Limited
category: news_publishing
domains:
  - economist.com
aliases:
  - Economist
  - Economist Espresso
  - Economist Digital
  - Economist Subscription
descriptorPatterns:
  - ECONOMIST
  - THE ECONOMIST
  - ECONOMIST NEWSPAPER
  - ECONOMIST.COM
  - ECONOMIST DIGITAL
typicalIntervals:
  - unit: month
    count: 1
  - unit: month
    count: 3
  - unit: year
    count: 1
notes: >-
  The Economist sells short introductory terms, typically twelve weeks, that roll into a full
  annual subscription at the standard price, so the second charge is usually several times the
  first. Print, digital and Espresso can be separate lines on one account. Where the account
  page has no self-service control the cancellation is only recorded once customer services
  reply, which is why this playbook ends by asking for written confirmation.
playbooks:
  - channel: direct
    method: email
    difficulty: 3
    cancelUrl: https://myaccount.economist.com/
    steps:
      - text: >-
          Sign in at myaccount.economist.com and open the subscription details. Note the
          subscriber reference and the renewal date shown there.
      - text: >-
          If a Turn off automatic renewal or Cancel subscription control appears under the plan,
          use it and continue to the confirmation screen.
        detail: >-
          The control is not offered on every plan or in every region. Where it is missing the
          account page shows only the renewal date, and the request has to go to customer
          services.
      - text: >-
          Otherwise open the contact page for your region from the help link and send the
          cancellation request by email, quoting the subscriber reference.
      - text: >-
          Send it well before the renewal date rather than on it, because the request is only
          effective once customer services have processed it.
      - text: >-
          Ask for a reply confirming that the automatic renewal has been stopped and stating the
          date access ends, and keep that reply.
    noticePeriodDays: 0
    refundPolicy: >-
      The Economist bills the term up front and access normally continues to the end of the paid
      period; where a partial refund is offered on an annual subscription it is calculated by
      customer services on request.
    retentionOfferNotes: >-
      Customer services commonly reply with a discounted renewal or an extension of the
      introductory rate before processing the cancellation. The request stays open until it is
      answered plainly.
    gotchas:
      - The introductory term rolls into a full-price annual subscription automatically at the end of the offer.
      - Print and digital elements of a bundle can stop on different dates.
      - Espresso and Economist Films subscriptions bought separately keep billing after the main subscription ends.
      - A subscription bought in the App Store or Play is billed by the store and customer services cannot stop it.
      - Replies from customer services can take several working days, so a request sent close to the renewal date may not beat the charge.
    letterTemplate: |
      Subject: Cancellation of my subscription - reference {{accountReference}}

      {{date}}

      Dear Customer Services,

      I subscribe to The Economist. My subscriber reference is {{accountReference}} and the
      subscription is registered to {{fullName}} at {{email}}.

      Please stop the automatic renewal of this subscription and close it at the end of the
      period I have already paid for. Please do not replace it with a discounted or alternative
      offer.

      Please reply in writing to confirm that the automatic renewal has been stopped and tell me
      the date my access ends.

      Yours faithfully,
      {{fullName}}
    evidenceHint: >-
      Keep the sent email and the reply that names the end date, plus a screenshot of the account
      page once it stops showing a renewal.
    sourceUrl: https://www.economist.com/help
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap The Economist or Economist Espresso.
        detail: >-
          On a Mac, open App Store, click your name at the bottom left, then Account Settings,
          then Manage next to Subscriptions.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
        detail: If the only button offered is Resubscribe, the subscription is already set to expire.
      - text: Note the expiry date shown under the entry.
    noticePeriodDays: 0
    gotchas:
      - Deleting the app leaves the billing running.
      - Economist customer services cannot stop an Apple-billed subscription and will send you back to the App Store.
      - The Economist and Espresso can each have their own entry in the Subscriptions list.
    evidenceHint: Screenshot the Subscriptions screen showing the entry expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: >-
          Open the Google Play Store app, tap your profile picture, then Payments and
          subscriptions, then Subscriptions.
      - text: Tap The Economist, then Cancel subscription, and pick a reason when prompted.
      - text: Continue to the end until the entry shows an expiry date instead of a renewal date.
    noticePeriodDays: 0
    gotchas:
      - The subscription belongs to the Google account that bought it, which may not be the one signed in on the phone now.
      - Uninstalling the app leaves the subscription running.
      - Economist customer services cannot stop a Play-billed subscription.
    evidenceHint: Screenshot the Play subscriptions entry showing the expiry date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
