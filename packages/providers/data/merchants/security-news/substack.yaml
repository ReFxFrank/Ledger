slug: substack
name: Substack
legalName: Substack Inc.
category: creator_support
domains:
  - substack.com
aliases:
  - Substack Subscription
  - Substack Newsletter
descriptorPatterns:
  - SUBSTACK
  - SUBSTACK.COM
  - SUBSTACK INC
typicalIntervals:
  - unit: month
    count: 1
  - unit: year
    count: 1
notes: >-
  Every paid newsletter is its own subscription with its own renewal date, so one reader can
  carry six Substack charges that look identical on a statement and differ only by amount.
  Cancelling one leaves the rest untouched. Some publications set their own descriptor, so a
  charge naming a writer or a publication rather than Substack may still be a Substack payment.
playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    cancelUrl: https://substack.com/settings
    steps:
      - text: >-
          Sign in at substack.com in a browser and open substack.com/settings from the menu under
          your profile picture.
      - text: >-
          Scroll to Subscriptions. Every paid publication is listed with its price and next
          billing date, which is the only place they can all be seen at once.
      - text: Click the publication you want to stop, then Manage subscription.
        detail: >-
          The same screen can be reached from the receipt email for that publication, which links
          straight to its billing page.
      - text: Choose Cancel subscription and confirm.
        warning: >-
          The screen offers to pause for a set number of months in the position where cancel
          would normally be. Pausing keeps the subscription and resumes billing on its own.
      - text: >-
          Go back to Subscriptions and check the entry now shows an end date, then repeat for any
          other publication that is still billing.
    noticePeriodDays: 0
    refundPolicy: >-
      Paid access runs to the end of the period already paid for. Refunds are decided by the
      individual publication rather than centrally, and the writer is asked through the
      publication's own contact address.
    retentionOfferNotes: >-
      Substack offers a pause rather than a discount, and some publications add a cheaper tier at
      the same step.
    gotchas:
      - Each publication is a separate charge, so cancelling one does nothing to the others.
      - A pause resumes billing automatically at the end of the pause period.
      - An annual subscription keeps access for the rest of the year already paid for.
      - A subscription bought in the Substack iOS app is billed by Apple and cannot be cancelled from substack.com.
      - Unsubscribing from the emails only stops the emails; the payment continues until the subscription itself is cancelled.
    evidenceHint: >-
      Screenshot the Subscriptions list showing every publication and its state, so a missed one
      is visible later.
    sourceUrl: https://support.substack.com/hc/en-us/search?query=cancel%20subscription
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap the entry for the publication.
        detail: >-
          Apple lists these under the publication's own name rather than under Substack, so
          match by price and renewal date if the name is unfamiliar.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
        detail: If the only button offered is Resubscribe, the subscription is already set to expire.
      - text: Note the expiry date shown under the entry.
    noticePeriodDays: 0
    gotchas:
      - Deleting the Substack app leaves the billing running.
      - substack.com cannot cancel an Apple-billed subscription; its settings page shows it as managed by Apple.
      - Subscriptions bought on the website and in the app can exist side by side for the same publication.
    evidenceHint: Screenshot the Subscriptions screen showing the publication expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"
