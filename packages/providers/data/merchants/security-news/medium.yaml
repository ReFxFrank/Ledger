slug: medium
name: Medium
legalName: A Medium Corporation
category: news_publishing
domains:
  - medium.com
aliases:
  - Medium Membership
  - Medium Member
descriptorPatterns:
  - MEDIUM
  - MEDIUM.COM
  - MEDIUM MEMBERSHIP
  - MEDIUM CORPORATION
typicalIntervals:
  - unit: month
    count: 1
  - unit: year
    count: 1
notes: >-
  Medium sells one membership at a monthly or annual price, so a Medium charge is almost always
  that membership rather than a payment to an individual writer. The annual plan is billed as a
  single payment and renews on the anniversary of the first charge.
playbooks:
  - channel: direct
    method: account_settings
    difficulty: 1
    cancelUrl: https://medium.com/me/settings/membership
    steps:
      - text: >-
          Sign in at medium.com in a browser and open Settings from the menu under your profile
          picture.
      - text: Open the Membership tab and read the renewal date and price.
        detail: >-
          If this tab says the membership is managed through Apple or Google, the store is the
          biller and the page has no cancel control.
      - text: Choose Cancel membership, then confirm on the dialog that appears.
        warning: >-
          The dialog offers to switch to a cheaper monthly plan instead of cancelling. That keeps
          a charge running.
      - text: >-
          Check the Membership tab now says the membership ends on a date rather than renews on
          one.
    noticePeriodDays: 0
    refundPolicy: >-
      Medium keeps membership active to the end of the period already paid for; an annual plan
      cancelled part way through is not credited for the remaining months.
    retentionOfferNotes: A downgrade to the monthly plan is offered in the cancel dialog.
    gotchas:
      - Membership stays active until the end of the paid period, so member-only stories keep opening and that is not a failed cancellation.
      - A membership bought in the iOS or Android app is billed by the store and cannot be cancelled from medium.com.
      - Cancelling the membership does not close the account or delete what you published.
      - Any separate paid subscription to an individual publication on Medium is billed on its own and is not covered by cancelling membership.
    evidenceHint: Screenshot the Membership tab showing the end date, and keep the cancellation email.
    sourceUrl: https://help.medium.com/hc/en-us/search?query=cancel%20membership
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap Medium.
        detail: >-
          On a Mac, open App Store, click your name at the bottom left, then Account Settings,
          then Manage next to Subscriptions.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
        detail: If the only button offered is Resubscribe, the subscription is already set to expire.
      - text: Note the expiry date shown under the Medium entry.
    noticePeriodDays: 0
    gotchas:
      - Deleting the app leaves the billing running.
      - medium.com cannot cancel an Apple-billed membership and its settings page says so.
      - Refunds for Apple-billed plans go through reportaproblem.apple.com.
    evidenceHint: Screenshot the Subscriptions screen showing Medium expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: >-
          Open the Google Play Store app, tap your profile picture, then Payments and
          subscriptions, then Subscriptions.
      - text: Tap Medium, then Cancel subscription, and pick a reason when prompted.
      - text: Continue to the end until the entry shows an expiry date instead of a renewal date.
    noticePeriodDays: 0
    gotchas:
      - The subscription belongs to the Google account that bought it, which may not be the one signed in on the phone now.
      - Uninstalling the app leaves the subscription running.
      - medium.com cannot stop a Play-billed membership.
    evidenceHint: Screenshot the Play subscriptions entry showing the expiry date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
