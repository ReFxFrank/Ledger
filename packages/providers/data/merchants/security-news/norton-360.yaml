notes: >-
  Norton subscriptions are enrolled in the automatic renewal service by default and the renewal
  payment is taken before the current term ends, so the charge lands earlier than the
  anniversary a user remembers. The first year is a promotional price and the renewal is at the
  list price, often two or three times larger. Some statements show Gen Digital rather than
  Norton.
playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    cancelUrl: https://my.norton.com/
    steps:
      - text: Sign in at my.norton.com with the Norton account email, not the device software.
      - text: Open My Subscriptions from the menu and find the subscription that matches the charge.
        detail: >-
          Each entry shows the renewal date and the amount that will be taken. Note that this
          date is when the term ends, and the payment is taken some days before it.
      - text: Open the subscription, then choose Cancel Subscription Renewal.
        detail: >-
          The link sits in the renewal section of the subscription details, below the device
          list, rather than next to the plan name.
      - text: Answer the reason question and continue past the retention offer to the final confirmation.
        warning: >-
          The offer screen presents a discounted renewal as the main button. Stopping there
          leaves automatic renewal switched on.
      - text: >-
          Return to My Subscriptions and check the entry now says the subscription expires on a
          date with no renewal charge listed.
    noticePeriodDays: 0
    refundPolicy: >-
      Norton describes a 60-day money-back window on annual subscriptions and 14 days on monthly
      ones, counted from the charge. After a renewal has been taken the refund is arranged
      through Member Services rather than from the account page.
    retentionOfferNotes: >-
      Expect a discounted renewal, and sometimes an extra free period, before the cancellation
      completes.
    gotchas:
      - The renewal payment is taken before the current term ends, so switching renewal off on the expiry date is already too late.
      - Turning renewal off does not undo a charge that has already been taken; that needs a separate refund request.
      - Uninstalling Norton from the computer leaves the subscription and its renewal untouched.
      - Norton 360, LifeLock identity plans and Norton Utilities are separate subscriptions on one account and each is cancelled on its own.
      - A subscription bought through a device maker's pre-installed trial still bills through Norton and is stopped here.
    evidenceHint: >-
      Screenshot the My Subscriptions entry showing the expiry date with no upcoming renewal, and
      keep the cancellation email.
    sourceUrl: https://support.norton.com/
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap the Norton entry, usually listed as Norton 360.
        detail: >-
          On a Mac, open App Store, click your name at the bottom left, then Account Settings,
          then Manage next to Subscriptions.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
        detail: If the only button offered is Resubscribe, the subscription is already set to expire.
      - text: Note the expiry date shown under the Norton entry.
    noticePeriodDays: 0
    gotchas:
      - Deleting the app leaves the billing running.
      - my.norton.com cannot cancel an Apple-billed subscription and Member Services will send you back to the App Store.
      - Refunds for Apple-billed plans go through reportaproblem.apple.com.
    evidenceHint: Screenshot the Subscriptions screen showing Norton expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: >-
          Open the Google Play Store app, tap your profile picture, then Payments and
          subscriptions, then Subscriptions.
      - text: Tap the Norton 360 entry, then Cancel subscription, and pick a reason when prompted.
      - text: Continue to the end until the entry shows an expiry date instead of a renewal date.
    noticePeriodDays: 0
    gotchas:
      - The subscription belongs to the Google account that bought it, which may not be the one signed in on the phone now.
      - Uninstalling the app leaves the subscription running.
      - my.norton.com cannot stop a Play-billed subscription.
    evidenceHint: Screenshot the Play subscriptions entry showing the expiry date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
