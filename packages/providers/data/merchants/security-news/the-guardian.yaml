slug: the-guardian
name: The Guardian
legalName: Guardian News & Media Limited
category: news_publishing
domains:
  - theguardian.com
aliases:
  - Guardian
  - Guardian supporter
  - Guardian recurring contribution
  - Guardian Weekly
descriptorPatterns:
  - THE GUARDIAN
  - GUARDIAN NEWS
  - GUARDIAN NEWS AND MEDIA
  - GUARDIAN NEWS & MEDIA
  - GUARDIAN MEDIA
typicalIntervals:
  - unit: month
    count: 1
  - unit: year
    count: 1
notes: >-
  Most Guardian charges are recurring supporter contributions rather than a paywall
  subscription, so the amount is whatever the reader chose and often does not match any
  published price. In the UK they are usually collected by Direct Debit, which means the bank
  and the Guardian each hold a record and both have to agree the payment has stopped.
playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    cancelUrl: https://manage.theguardian.com/
    steps:
      - text: >-
          Sign in at manage.theguardian.com with the email that receives the Guardian receipts.
          Contributions made without an account are tied to that email address, so use the
          sign-in link sent to it if there is no password.
      - text: >-
          Find the contribution or subscription in the list and open it. Each one shows the
          amount, the payment method and the next payment date.
      - text: Choose Cancel and answer the short reason question.
        detail: >-
          The control is at the bottom of the card for that contribution, under Manage payment
          method and Change amount.
        warning: >-
          The page offers to lower the amount or pause instead. Both keep the payment
          arrangement in place.
      - text: >-
          Continue to the final confirmation and check the card now says the contribution has
          been cancelled and names the date support ends.
      - text: >-
          If the flow does not complete, email customer.help@theguardian.com from the address on
          the account with the amount and date of the last payment and ask for it to be stopped.
    noticePeriodDays: 0
    refundPolicy: >-
      Contributions already collected are treated as given and are not returned automatically;
      anything of that kind is handled by customer help case by case.
    retentionOfferNotes: >-
      The exit flow suggests a smaller monthly amount or a pause before it offers to complete
      the cancellation.
    gotchas:
      - A Direct Debit collection already in motion can still arrive after cancelling, so leave several working days before the next payment date.
      - Cancelling only at the bank leaves the Guardian's record open and can trigger failed-payment emails; cancel in Manage first, then in the bank if you want both closed.
      - Supporter extras such as the ad-free app and unlimited app access stop at the end of the period supported.
      - Guardian Weekly print delivery is a separate subscription with its own stop date.
      - An ad-free or app subscription bought in the App Store or Play is billed by the store and does not appear in Manage.
    evidenceHint: >-
      Screenshot the Manage page showing the contribution cancelled, and keep the confirmation
      email.
    sourceUrl: https://manage.theguardian.com/help-centre
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap The Guardian.
        detail: >-
          On a Mac, open App Store, click your name at the bottom left, then Account Settings,
          then Manage next to Subscriptions.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
        detail: If the only button offered is Resubscribe, the subscription is already set to expire.
      - text: Note the expiry date shown under the entry.
    noticePeriodDays: 0
    gotchas:
      - Deleting the app leaves the billing running.
      - manage.theguardian.com has no record of an App Store payment and cannot stop it.
      - A recurring contribution set up on the website is separate and keeps running even after the app subscription ends.
    evidenceHint: Screenshot the Subscriptions screen showing The Guardian expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: >-
          Open the Google Play Store app, tap your profile picture, then Payments and
          subscriptions, then Subscriptions.
      - text: Tap The Guardian, then Cancel subscription, and pick a reason when prompted.
      - text: Continue to the end until the entry shows an expiry date instead of a renewal date.
    noticePeriodDays: 0
    gotchas:
      - The subscription belongs to the Google account that bought it, which may not be the one signed in on the phone now.
      - Uninstalling the app leaves the subscription running.
      - A recurring contribution set up on the website is separate and keeps running.
    evidenceHint: Screenshot the Play subscriptions entry showing the expiry date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
