notes: >-
  The FT's trial is a nominal amount for four weeks and converts into a full-price subscription
  at the end of it unless it is stopped first, which is where most unwanted FT charges come
  from. Annual subscriptions are billed as one payment, so the next charge can be eleven months
  away and easy to miss.
playbooks:
  - channel: direct
    method: chat
    difficulty: 3
    cancelUrl: https://www.ft.com/myaccount
    steps:
      - text: >-
          Sign in at ft.com and open Account settings from the menu under your name, then the
          subscription section at ft.com/myaccount.
      - text: >-
          Read the renewal date and the amount. On a trial, the date shown is the day the full
          price starts, and that is the deadline to work back from.
      - text: >-
          Choose Cancel subscription at the foot of the subscription panel. The FT routes this to
          an account management chat rather than finishing on the page.
        warning: >-
          The chat is where the cancellation is actually recorded. Closing the window before an
          agent confirms it leaves the subscription running.
      - text: >-
          Tell the agent you want to cancel, give the email on the account, decline the offers,
          and ask for the effective date.
      - text: >-
          Ask for the confirmation to be emailed, then check ft.com/myaccount a few days later
          and confirm no future payment is listed.
    noticePeriodDays: 0
    refundPolicy: >-
      Access normally continues to the end of the period already paid for. On an annual
      subscription paid in one payment, any adjustment is calculated by account management on
      request rather than applied automatically.
    retentionOfferNotes: >-
      The chat opens with a discounted rate or a switch to a cheaper tier, often presented before
      the agent acknowledges the cancellation request.
    gotchas:
      - The four-week trial converts to the full price automatically, so it has to be stopped before the trial ends rather than after the first full charge.
      - The cancel control opens a chat with limited hours in some regions, so plan for it not to complete in one sitting.
      - The exit flow offers a pause or a downgrade in the position where a cancel button would normally sit.
      - A subscription supplied through an employer's group licence is administered by that employer and not by the ft.com account page.
      - An FT subscription bought in the App Store or Play is billed by the store and the FT cannot stop it.
    evidenceHint: >-
      Save the chat transcript and the confirmation email naming the last day of access.
    sourceUrl: https://help.ft.com/
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap the Financial Times entry.
        detail: >-
          On a Mac, open App Store, click your name at the bottom left, then Account Settings,
          then Manage next to Subscriptions.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
        detail: If the only button offered is Resubscribe, the subscription is already set to expire.
      - text: Note the expiry date shown under the entry.
    noticePeriodDays: 0
    gotchas:
      - Deleting the app leaves the billing running.
      - FT account management cannot stop an Apple-billed subscription and will send you back to the App Store.
      - Refunds for Apple-billed plans go through reportaproblem.apple.com.
    evidenceHint: Screenshot the Subscriptions screen showing the Financial Times entry expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: >-
          Open the Google Play Store app, tap your profile picture, then Payments and
          subscriptions, then Subscriptions.
      - text: Tap the Financial Times entry, then Cancel subscription, and pick a reason when prompted.
      - text: Continue to the end until the entry shows an expiry date instead of a renewal date.
    noticePeriodDays: 0
    gotchas:
      - The subscription belongs to the Google account that bought it, which may not be the one signed in on the phone now.
      - Uninstalling the app leaves the subscription running.
      - FT account management cannot stop a Play-billed subscription.
    evidenceHint: Screenshot the Play subscriptions entry showing the expiry date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
