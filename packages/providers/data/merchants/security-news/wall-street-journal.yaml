slug: wall-street-journal
name: The Wall Street Journal
legalName: Dow Jones & Company, Inc.
category: news_publishing
domains:
  - wsj.com
aliases:
  - WSJ
  - Wall Street Journal
  - WSJ Digital
  - WSJ Print
descriptorPatterns:
  - WSJ
  - WSJ.COM
  - WALL STREET JOURNAL
  - THE WALL STREET JOURNAL
  - WSJ SUBSCRIPTION
typicalIntervals:
  - unit: month
    count: 1
  - unit: year
    count: 1
notes: >-
  Dow Jones sells WSJ, Barron's and MarketWatch subscriptions from the same customer centre and
  some statements print the parent company rather than the title, so a Dow Jones charge is not
  automatically the WSJ. Introductory offers are monthly for a fixed number of months and then
  step up to the standard rate.
playbooks:
  - channel: direct
    method: chat
    difficulty: 3
    phone: "1-800-568-7625"
    hours: Mon-Fri 7am-10pm ET, Sat-Sun 7am-3pm ET
    cancelUrl: https://customercenter.wsj.com/
    steps:
      - text: >-
          Sign in at customercenter.wsj.com with the email on the subscription. This is the
          billing account and is separate from the wsj.com reading profile.
      - text: >-
          Open the subscription under My Account and read the next billing date and amount before
          starting the cancellation.
      - text: >-
          Choose Cancel subscription. The link is at the foot of the subscription panel, and it
          opens a chat or a callback request with a representative rather than a confirmation
          page.
        warning: >-
          Leaving the chat before the representative states an end date leaves the subscription
          billing.
      - text: >-
          Tell the representative you want to cancel, decline the retention rates, and ask for
          the date access ends and a written confirmation.
      - text: >-
          If chat is closed, call the customer service number and ask for cancellations rather
          than leaving a half-finished request on the site.
      - text: Check customercenter.wsj.com a few days later and confirm no future charge is listed.
    noticePeriodDays: 0
    refundPolicy: >-
      Access continues to the end of the period already paid for. Print delivery stops at the end
      of the current delivery period and any unserved part is handled by customer service.
    retentionOfferNotes: >-
      Representatives offer several months at a reduced rate, and sometimes a downgrade from
      print-and-digital to digital only. Accepting starts a new term.
    gotchas:
      - The introductory monthly rate steps up to the standard rate at the end of the offer with no second confirmation.
      - A WSJ subscription bought in the iOS or Android app is billed by the store and the customer centre cannot stop it.
      - WSJ, Barron's and MarketWatch are separate subscriptions even when bought together as a bundle offer.
      - A subscription supplied through an employer or a university is administered by that organisation, not by the customer centre.
      - Print and digital elements of a bundle can have different stop dates.
    evidenceHint: >-
      Save the chat transcript or the case number from the call, plus the email that names the
      last day of access.
    sourceUrl: https://customercenter.wsj.com/
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap the WSJ entry.
        detail: >-
          On a Mac, open App Store, click your name at the bottom left, then Account Settings,
          then Manage next to Subscriptions.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
        detail: If the only button offered is Resubscribe, the subscription is already set to expire.
      - text: Note the expiry date shown under the WSJ entry.
    noticePeriodDays: 0
    gotchas:
      - Deleting the app leaves the billing running.
      - The WSJ customer centre cannot cancel an Apple-billed subscription and will send you back to the App Store.
      - Refunds for Apple-billed plans go through reportaproblem.apple.com.
    evidenceHint: Screenshot the Subscriptions screen showing the WSJ entry expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: >-
          Open the Google Play Store app, tap your profile picture, then Payments and
          subscriptions, then Subscriptions.
      - text: Tap the WSJ entry, then Cancel subscription, and pick a reason when prompted.
      - text: Continue to the end until the entry shows an expiry date instead of a renewal date.
    noticePeriodDays: 0
    gotchas:
      - The subscription belongs to the Google account that bought it, which may not be the one signed in on the phone now.
      - Uninstalling the app leaves the subscription running.
      - The WSJ customer centre cannot stop a Play-billed subscription.
    evidenceHint: Screenshot the Play subscriptions entry showing the expiry date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
