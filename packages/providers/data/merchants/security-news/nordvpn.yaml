    count: 1
  - unit: year
    count: 2
notes: >-
  Billing lives in the Nord Account, never in the VPN app, and the long plans are the norm: a
  single charge with no repeat for two years is a 2-year plan renewing, not a one-off. The
  advertised price is an introductory rate for the first term only, so the renewal charge is
  usually much larger than the charge the user remembers agreeing to.
playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    cancelUrl: https://my.nordaccount.com/billing/subscriptions/
    steps:
      - text: >-
          Sign in at my.nordaccount.com with the email that receives the invoices. The VPN app
          has no billing screen at all, so the app is a dead end for this.
      - text: Open Billing, then Subscriptions, and select the NordVPN plan.
        detail: >-
          The plan card shows the next payment date and the amount. That amount is the standard
          renewal rate rather than the intro price paid for the first term.
      - text: Choose Cancel automatic payments and continue through to the final confirmation.
        warning: >-
          A discount offer sits between the button and the confirmation. Closing the tab on that
          offer screen leaves the renewal switched on.
      - text: >-
          Reload Billing, then Subscriptions, and check the plan now shows an end date instead of
          a next payment date.
    noticePeriodDays: 0
    refundPolicy: >-
      NordVPN advertises a 30-day money-back window on plans bought from its own site. The
      request is made through the 24/7 live chat rather than from the account page, and a plan
      bought in an app store is refunded by that store instead.
    retentionOfferNotes: >-
      Expect one or two screens offering extra months or a lower renewal price. Accepting either
      starts a fresh term and moves the renewal date.
    gotchas:
      - Access continues to the end of the period already paid for; part-periods are not credited.
      - A plan bought inside the iPhone or Android app shows in Nord Account as managed by the store, and only the store can stop it.
      - If the plan was paid with PayPal, check paypal.com under Payments, then Automatic payments, for a leftover NordVPN billing agreement.
      - NordVPN, NordPass and NordLocker are separate subscriptions on one account and each has its own cancel button.
    evidenceHint: >-
      Screenshot the subscription card showing automatic payments off and the date access ends,
      and keep the cancellation email.
    sourceUrl: https://support.nordvpn.com/hc/en-us/search?query=cancel%20subscription
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap NordVPN.
        detail: >-
          On a Mac, open App Store, click your name at the bottom left, then Account Settings,
          then Manage next to Subscriptions.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
        detail: If the only button offered is Resubscribe, the subscription is already set to expire.
      - text: Note the expiry date shown under the NordVPN entry.
    noticePeriodDays: 0
    gotchas:
      - Deleting the app leaves the billing running.
      - Nord Account cannot stop an Apple-billed plan and shows no cancel button for it.
      - Refunds for Apple-billed plans go through reportaproblem.apple.com, not through Nord support chat.
    evidenceHint: Screenshot the Subscriptions screen showing NordVPN expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: >-
          Open the Google Play Store app, tap your profile picture, then Payments and
          subscriptions, then Subscriptions.
      - text: Tap NordVPN, then Cancel subscription, and pick a reason when prompted.
      - text: Continue to the end until the entry shows an expiry date instead of a renewal date.
    noticePeriodDays: 0
    gotchas:
      - The subscription belongs to the Google account that bought it, which may not be the one signed in on the phone now.
      - Uninstalling the app leaves the subscription running.
      - Nord Account cannot stop a Play-billed plan.
    evidenceHint: Screenshot the Play subscriptions entry showing the expiry date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
