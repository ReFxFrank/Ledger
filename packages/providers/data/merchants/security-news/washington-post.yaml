slug: washington-post
name: The Washington Post
legalName: WP Company LLC
category: news_publishing
domains:
  - washingtonpost.com
aliases:
  - Washington Post
  - WaPo
  - Washington Post Digital
descriptorPatterns:
  - WASHINGTON POST
  - WASHINGTONPOST.COM
  - WASHINGTONPOST
  - THE WASHINGTON POST
  - WAPO SUBSCRIPTION
typicalIntervals:
  - unit: month
    count: 1
  - unit: week
    count: 4
  - unit: year
    count: 1
notes: >-
  The Post sells heavily discounted introductory terms, usually a year at a low rate, that step
  up to the standard price at the first renewal without a second confirmation. Some plans bill
  every four weeks rather than monthly, so a charge that looks monthly can appear thirteen times
  a year.
playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    phone: "1-800-477-4679"
    hours: Mon-Fri 6am-8pm ET, Sat-Sun 7am-3pm ET
    cancelUrl: https://subscribe.washingtonpost.com/myaccount/
    steps:
      - text: >-
          Sign in at washingtonpost.com, open the account menu at the top right and choose My
          Account, which opens subscribe.washingtonpost.com.
      - text: Open the Subscription or Manage subscription panel and read the renewal date and price.
      - text: Choose Cancel subscription at the bottom of that panel.
        detail: >-
          The link sits under the plan and payment details, below the billing history, rather
          than beside the plan name.
      - text: Work through the offer screens to the final confirmation.
        warning: >-
          One of the screens offers a lower rate and another offers to pause delivery. Both keep
          the subscription alive; only the last confirmation ends it.
      - text: >-
          If the flow hands off to a chat window or asks for a callback, stay with it until an
          agent states the date access ends.
      - text: Reload My Account and check the plan now shows an end date rather than a next charge.
    noticePeriodDays: 0
    refundPolicy: >-
      Digital access continues to the end of the period already paid for and part-periods are not
      credited. Print home delivery stops at the end of the billed delivery period.
    retentionOfferNotes: >-
      Expect a discounted rate for a fixed number of months, sometimes with an extra free month,
      before the cancel confirmation appears. Accepting starts a new term at that rate.
    gotchas:
      - The introductory rate steps up to the standard price at the first renewal automatically.
      - Some plans bill every four weeks, so the renewal date walks earlier through the calendar.
      - Print home delivery has its own stop date and is not ended by cancelling digital access.
      - A subscription bought in the iOS or Android app is billed by the store and cannot be stopped from the Post's site.
      - An all-access subscription bought through a corporate or university offer is managed by that organisation instead.
    evidenceHint: >-
      Screenshot the My Account panel showing the end date, and keep the cancellation email or
      chat transcript.
    sourceUrl: https://helpcenter.washingtonpost.com/hc/en-us/search?query=cancel%20subscription
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap The Washington Post.
        detail: >-
          On a Mac, open App Store, click your name at the bottom left, then Account Settings,
          then Manage next to Subscriptions.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
        detail: If the only button offered is Resubscribe, the subscription is already set to expire.
      - text: Note the expiry date shown under the entry.
    noticePeriodDays: 0
    gotchas:
      - Deleting the app leaves the billing running.
      - The Post cannot cancel an Apple-billed subscription and its account page shows the plan as managed by Apple.
      - Refunds for Apple-billed plans go through reportaproblem.apple.com.
    evidenceHint: Screenshot the Subscriptions screen showing The Washington Post expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: >-
          Open the Google Play Store app, tap your profile picture, then Payments and
          subscriptions, then Subscriptions.
      - text: Tap The Washington Post, then Cancel subscription, and pick a reason when prompted.
      - text: Continue to the end until the entry shows an expiry date instead of a renewal date.
    noticePeriodDays: 0
    gotchas:
      - The subscription belongs to the Google account that bought it, which may not be the one signed in on the phone now.
      - Uninstalling the app leaves the subscription running.
      - The Post cannot stop a Play-billed subscription.
    evidenceHint: Screenshot the Play subscriptions entry showing the expiry date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
