slug: dropbox
name: Dropbox
legalName: Dropbox, Inc.
category: cloud_storage
domains:
  - dropbox.com
aliases:
  - Dropbox Plus
  - Dropbox Professional
  - Dropbox Essentials
  - Dropbox Family
descriptorPatterns:
  - DROPBOX
  - DROPBOX.COM
  - DROPBOX PLUS
  - DROPBOX FAMILY
  - DROPBOX ESSENTIALS
typicalIntervals:
  - unit: month
    count: 1
  - unit: year
    count: 1
notes: >-
  Dropbox usually prints DROPBOX followed by an order reference, so the reference is noise and the
  brand token is the whole signal. Annual billing is heavily pushed at signup, so a single charge
  a year apart is normal here rather than suspicious. Cancelling a paid plan converts the account
  to Dropbox Basic; it does not delete the account, and the two are separate flows.
playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    cancelUrl: https://www.dropbox.com/account/plan
    steps:
      - text: Sign in at dropbox.com and click your avatar in the bottom-left corner, then Manage account.
      - text: Open the Plan tab, then click Cancel plan at the bottom of the page.
        detail: >-
          The button sits under the plan summary, below Change plan. On the Family plan only the
          plan manager sees it; other members can leave the family but cannot end the billing.
      - text: Work through the reason screen and the offer screen, then confirm the cancellation.
        warning: Leaving the flow at the offer screen leaves the plan active and renewing.
      - text: Go back to the Billing tab and check for the "Plan downgrade scheduled" notice.
      - text: Keep the cancellation email — it names the date the account becomes Basic.
    noticePeriodDays: 0
    refundPolicy: >-
      Dropbox keeps the account on the paid plan until the end of the cycle already paid for
      rather than refunding the unused part; refunds outside that are handled case by case by
      support.
    retentionOfferNotes: >-
      The exit flow offers a discounted month or a switch to a cheaper plan before the final
      confirmation. Both keep the subscription alive.
    gotchas:
      - Downgrading to a cheaper paid plan is presented in the same flow as cancelling and is easy to pick by mistake.
      - The account keeps paid features until the end of the cycle, so the plan page can still look paid the day after cancelling.
      - If the account holds more data than Basic allows, syncing stops when the plan ends until enough files are removed.
      - A subscription bought in the iOS or Android app cannot be cancelled on dropbox.com.
    evidenceHint: Screenshot the Billing tab showing "Plan downgrade scheduled" with the date, and keep the confirmation email.
    sourceUrl: https://help.dropbox.com/plans/downgrade-dropbox-individual-plans
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the top.
      - text: Tap Subscriptions, then tap Dropbox.
      - text: Tap Cancel Subscription and confirm.
        detail: On a Mac, open App Store, click your name at the bottom left, then Account Settings, then Manage next to Subscriptions.
    noticePeriodDays: 0
    gotchas:
      - dropbox.com shows an Apple-billed plan without a cancel button, because Apple holds the payment method.
      - Deleting the Dropbox app leaves the billing running.
    evidenceHint: Screenshot the Subscriptions screen showing Dropbox expiring on a date.
    sourceUrl: https://help.dropbox.com/plans/cancel-mobile
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: Open the Google Play Store app, tap your profile icon, then Payments & subscriptions, then Subscriptions.
      - text: Tap Dropbox, then Cancel subscription, and pick a reason when prompted.
      - text: Confirm and check the entry now shows an expiry date.
    noticePeriodDays: 0
    gotchas:
      - The plan stays paid until the end of the term already bought, then drops to Basic.
      - Uninstalling the app does not stop the billing.
    evidenceHint: Screenshot the Play subscriptions entry showing Dropbox expiring on a date.
    sourceUrl: https://help.dropbox.com/plans/cancel-mobile
    lastVerifiedAt: "2026-07-25"
