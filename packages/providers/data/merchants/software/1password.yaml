slug: 1password
name: 1Password
legalName: AgileBits Inc.
category: security_vpn
domains:
  - 1password.com
  - agilebits.com
aliases:
  - 1Password Families
  - 1Password Individual
  - AgileBits
descriptorPatterns:
  - 1PASSWORD
  - 1PASSWORD.COM
  - AGILEBITS
  - AGILEBITS 1PASSWORD
typicalIntervals:
  - unit: month
    count: 1
  - unit: year
    count: 1
notes: >-
  Older charges print AGILEBITS rather than the brand name, so both are treated as the same
  merchant here. A cancelled 1Password account is frozen rather than deleted — the vault stays
  readable for a while and can be reactivated, which means a cancellation confirmation is not the
  same as the data being gone.
playbooks:
  - channel: direct
    method: account_settings
    difficulty: 1
    steps:
      - text: Sign in to your account on 1password.com in a browser.
        detail: >-
          The desktop and mobile apps have no billing screen at all; the sign-in page is at
          my.1password.com or at your team's own sign-in address.
      - text: Select Billing in the sidebar.
        detail: >-
          If Billing is missing, the account signed in is not the family organiser, team owner, or
          in a group with the Manage Billing permission — those are the only accounts that can end
          the subscription.
      - text: Select Cancel subscription and follow the prompts to the end.
      - text: Check the Billing page shows the subscription running until a stated date, and keep the confirmation email.
    noticePeriodDays: 0
    refundPolicy: >-
      1Password describes itself as unable to refund past charges or the remaining time on a
      cancelled account; access continues to the end of the paid period.
    gotchas:
      - The account is frozen at the end of the paid period rather than deleted — items stay readable but cannot be edited, so exporting the vault before that date is worth doing.
      - Cancelling a family subscription affects every member of that family at once.
      - A subscription started as an in-app purchase on iPhone, iPad or Android is billed by the store and shows no Billing page here.
    evidenceHint: Screenshot the Billing page showing the end date, and keep the confirmation email.
    sourceUrl: https://support.1password.com/manage-subscription/
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the top.
      - text: Tap Subscriptions, then tap 1Password.
      - text: Tap Cancel Subscription and confirm.
    noticePeriodDays: 0
    gotchas:
      - A subscription started as an in-app purchase is billed by Apple, and 1password.com shows no Billing page for it.
      - Deleting the app leaves the billing running.
    evidenceHint: Screenshot the Subscriptions screen showing 1Password expiring on a date.
    sourceUrl: https://support.1password.com/apple-subscription/
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: Open the Google Play Store app, tap your profile icon, then Payments & subscriptions, then Subscriptions.
      - text: Tap 1Password, then Cancel subscription, and pick a reason.
      - text: Confirm and check the entry shows an expiry date.
    noticePeriodDays: 0
    gotchas:
      - An Android in-app purchase is billed by Google Play and cannot be cancelled on 1password.com.
      - Uninstalling the app does not stop the billing.
    evidenceHint: Screenshot the Play subscriptions entry showing the expiry date.
    sourceUrl: https://support.1password.com/android-subscription/
    lastVerifiedAt: "2026-07-25"
