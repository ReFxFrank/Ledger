slug: peacock
name: Peacock
legalName: Peacock TV LLC
category: streaming_video
domains:
  - peacocktv.com
aliases:
  - Peacock TV
  - Peacock Premium
  - Peacock Premium Plus
descriptorPatterns:
  - PEACOCK
  - PEACOCK TV
  - PEACOCKTV.COM
  - PEACOCK PREMIUM
typicalIntervals:
  - unit: month
    count: 1
  - unit: year
    count: 1
notes: >-
  Peacock arrives free with several Comcast and Xfinity packages and with some Instacart and
  Charter plans. Those accounts have no billing controls on peacocktv.com, and the partner has
  to end them. Annual plans are sold at a discount at sign-up, so a single yearly Peacock charge
  is a live subscription.
playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    cancelUrl: https://www.peacocktv.com/account/plans
    steps:
      - text: Sign in at peacocktv.com in a browser and open the profile icon at the top right, then Account.
        detail: The TV apps have no billing screen, and the phone app sends this flow out to a browser anyway.
      - text: Open Plans and Payment, then choose Change or Cancel Plan.
      - text: Choose Cancel Plan, then confirm on the screen that follows.
        warning: >-
          The intermediate screen leads with an offer to switch to the cheaper ad-supported tier
          or to pause; neither ends the subscription.
      - text: Check the Plans and Payment page now shows the date access ends and keep the confirmation email.
    noticePeriodDays: 0
    refundPolicy: >-
      Peacock does not prorate the unused part of a paid month or year; streaming continues to
      the end of the paid period and the account then reverts to a signed-out state.
    retentionOfferNotes: >-
      A discounted period and a downgrade to the cheaper tier are both offered before the final
      confirmation button becomes reachable.
    gotchas:
      - A Peacock subscription included with an Xfinity, Comcast or Charter package cannot be cancelled on peacocktv.com; it ends with that package.
      - An annual plan cancelled mid-term keeps running, and stays paid for, until the anniversary date.
      - Promotional annual plans renew at the standard price rather than the promotional one.
    evidenceHint: Screenshot the Plans and Payment page showing the end date, and keep the confirmation email.
    sourceUrl: https://www.peacocktv.com/help/article/how-do-i-cancel-my-subscription
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap Peacock TV.
        detail: On a Mac, open App Store, click your name at the bottom left, then Account Settings, then Manage next to Subscriptions.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
      - text: Note the expiry date shown under the Peacock entry.
    noticePeriodDays: 0
    gotchas:
      - peacocktv.com cannot cancel an Apple-billed subscription; the Plans page names Apple instead of offering a cancel link.
      - Deleting the app does not stop the billing.
    evidenceHint: Screenshot the Subscriptions screen showing Peacock expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: Open the Google Play Store app, tap your profile picture, then Payments and subscriptions, then Subscriptions.
      - text: Tap Peacock TV, then Cancel subscription, and pick a reason when prompted.
      - text: Tap through to the end until the entry shows an expiry date instead of a renewal date.
    noticePeriodDays: 0
    gotchas:
      - The subscription belongs to the Google account that bought it, which may not be the profile signed in on the phone today.
      - Uninstalling the app leaves the subscription running.
    evidenceHint: Screenshot the Play subscriptions entry showing the expiry date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"

  - channel: amazon
    method: app_store
    difficulty: 2
    cancelUrl: https://www.amazon.com/gp/video/settings
    steps:
      - text: Sign in at amazon.com and open Account and Lists, then Memberships and Subscriptions.
      - text: Open Prime Video Channels and find the Peacock row.
        detail: The same list appears in the Prime Video web player under the gear icon, then Channels.
      - text: Choose Cancel Channel and confirm on the End Subscription screen.
      - text: Check the row now shows the date the channel stops rather than a renewal date.
    noticePeriodDays: 0
    gotchas:
      - A Prime Video Channels subscription is billed by Amazon, so peacocktv.com cannot cancel it.
      - The Peacock app signed in with the same email can still show content until the channel period ends, which makes the cancellation look like it failed.
    evidenceHint: Screenshot the Channels page showing Peacock ending on a date.
    sourceUrl: https://www.amazon.com/yourmembershipsandsubscriptions
    lastVerifiedAt: "2026-07-25"

  - channel: roku
    method: app_store
    difficulty: 2
    cancelUrl: https://my.roku.com/account
    steps:
      - text: Sign in at my.roku.com and open Manage your subscriptions.
      - text: Find Peacock in the list and choose Unsubscribe, then confirm.
        detail: >-
          On the device, highlight the Peacock tile on the Roku home screen, press the star
          (Options) button, choose Manage subscription, then Cancel subscription.
      - text: Check the entry now shows the date the subscription ends.
    noticePeriodDays: 0
    gotchas:
      - Removing the channel from the Roku home screen does not cancel the billing.
      - peacocktv.com cannot cancel a Roku-billed subscription.
    evidenceHint: Screenshot the Roku subscriptions page showing Peacock ending on a date.
    sourceUrl: https://support.roku.com/article/208756478
    lastVerifiedAt: "2026-07-25"
