slug: paramount-plus
name: Paramount+
legalName: Paramount Global
category: streaming_video
domains:
  - paramountplus.com
aliases:
  - Paramount Plus
  - Paramount+
  - CBS All Access
  - Paramount Plus with Showtime
descriptorPatterns:
  - PARAMOUNT PLUS
  - PARAMOUNTPLUS.COM
  - PARAMOUNTPLUS
  - CBS ALL ACCESS
  - CBS INTERACTIVE
typicalIntervals:
  - unit: month
    count: 1
  - unit: year
    count: 1
notes: >-
  Sold as monthly and annual on both tiers, and the annual plan is the default choice on the
  sign-up page, so yearly Paramount charges are common. Accounts opened before 2021 can still
  carry a CBS All Access descriptor. Sports promotions sold through a club or broadcaster
  partner are billed by that partner and are invisible in the Paramount+ account page.
playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    cancelUrl: https://www.paramountplus.com/account/
    steps:
      - text: Sign in at paramountplus.com in a browser and open the profile icon at the top right, then Account.
      - text: Scroll to the Subscription and Billing section and choose Cancel Subscription.
        detail: >-
          The link sits under the plan name and the next billing date, below the payment method
          block. If the section instead names Apple, Google, Amazon, Roku or a partner, that
          biller has to be used instead.
      - text: Pick a reason, then choose Yes, Cancel on the final screen.
        warning: >-
          The screen before it offers a discounted period or a switch to the cheaper Essential
          tier; both of those buttons keep the subscription alive.
      - text: Check the Account page now shows the date access ends and keep the confirmation email.
    noticePeriodDays: 0
    refundPolicy: >-
      Paramount does not prorate the remainder of a paid month or year; the account keeps
      streaming until the paid period ends.
    retentionOfferNotes: >-
      A discounted renewal or a downgrade to the ad-supported Essential tier is offered
      immediately before the confirmation step.
    gotchas:
      - An annual plan cancelled after a month still runs, and stays paid for, until the anniversary date.
      - The Showtime add-on is part of the Premium tier, so downgrading to Essential silently removes Showtime content.
      - Free trials taken through a device or retailer promotion convert to a paid plan at the end of the trial with no further prompt.
    evidenceHint: Screenshot the Subscription and Billing section showing the end date, and keep the cancellation email.
    sourceUrl: https://help.paramountplus.com/s/article/PD-How-do-I-cancel-my-Paramount-subscription
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap Paramount+.
        detail: On a Mac, open App Store, click your name at the bottom left, then Account Settings, then Manage next to Subscriptions.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
      - text: Note the expiry date shown under the Paramount+ entry.
    noticePeriodDays: 0
    gotchas:
      - paramountplus.com cannot cancel an Apple-billed subscription; the Account page names Apple instead of offering a cancel link.
      - Deleting the app does not stop the billing.
    evidenceHint: Screenshot the Subscriptions screen showing Paramount+ expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: Open the Google Play Store app, tap your profile picture, then Payments and subscriptions, then Subscriptions.
      - text: Tap Paramount+, then Cancel subscription, and pick a reason when prompted.
      - text: Tap through to the end until the entry shows an expiry date instead of a renewal date.
    noticePeriodDays: 0
    gotchas:
      - The subscription belongs to the Google account that bought it, which may not be the profile signed in on the phone today.
      - Uninstalling the app leaves the subscription running.
    evidenceHint: Screenshot the Play subscriptions entry showing the expiry date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"

  - channel: amazon
    method: app_store
    difficulty: 2
    cancelUrl: https://www.amazon.com/gp/video/settings
    steps:
      - text: Sign in at amazon.com and open Account and Lists, then Memberships and Subscriptions.
      - text: Open Prime Video Channels and find the Paramount+ row.
        detail: The same list appears in the Prime Video web player under the gear icon, then Channels.
      - text: Choose Cancel Channel and confirm on the End Subscription screen.
      - text: Check the row now shows the date the channel stops rather than a renewal date.
    noticePeriodDays: 0
    gotchas:
      - A Prime Video Channels subscription is billed by Amazon, so paramountplus.com cannot cancel it.
      - The Amazon channel and a direct Paramount+ account can both exist under the same email, and cancelling one leaves the other charging.
    evidenceHint: Screenshot the Channels page showing Paramount+ ending on a date.
    sourceUrl: https://www.amazon.com/yourmembershipsandsubscriptions
    lastVerifiedAt: "2026-07-25"

  - channel: roku
    method: app_store
    difficulty: 2
    cancelUrl: https://my.roku.com/account
    steps:
      - text: Sign in at my.roku.com and open Manage your subscriptions.
      - text: Find Paramount+ in the list and choose Unsubscribe, then confirm.
        detail: >-
          On the device, highlight the Paramount+ tile on the Roku home screen, press the star
          (Options) button, choose Manage subscription, then Cancel subscription.
      - text: Check the entry now shows the date the subscription ends.
    noticePeriodDays: 0
    gotchas:
      - Removing the channel from the Roku home screen does not cancel the billing.
      - paramountplus.com cannot cancel a Roku-billed subscription.
    evidenceHint: Screenshot the Roku subscriptions page showing Paramount+ ending on a date.
    sourceUrl: https://support.roku.com/article/208756478
    lastVerifiedAt: "2026-07-25"
