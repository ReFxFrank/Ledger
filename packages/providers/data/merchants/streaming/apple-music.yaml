slug: apple-music
name: Apple Music
legalName: Apple Inc.
category: music_audio
domains:
  - music.apple.com
aliases:
  - Apple Music Family
  - Apple Music Student
  - Apple Music Individual
descriptorPatterns:
  - APPLE MUSIC
  - APPLE MUSIC SUBSCRIPTION
  - APL APPLE MUSIC
typicalIntervals:
  - unit: month
    count: 1
  - unit: year
    count: 1
notes: >-
  Apple bills every one of its services through the same APPLE.COM/BILL descriptor, so a
  statement line cannot be attributed to Apple Music rather than iCloud+, Apple TV+ or an app
  subscription. No merchant in this dataset claims that fragment, because doing so would attach
  an arbitrary service to the charge. The Subscriptions list on the device is the only reliable
  breakdown. Apple Music also sells a discounted annual plan for individual subscribers.
  iTunes Match is a separate Apple product and is deliberately not claimed here: once detection
  strips ITUNES as an Apple channel marker the fragment left over is MATCH, which belongs to
  Match.com.
playbooks:
  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap Apple Music.
        detail: >-
          On a Mac, open the Music app, then Account, then Account Settings, and use Manage next
          to Subscriptions. On Android, open the Apple Music app, tap the three-dot menu, then
          Account, then Manage Subscription.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
        detail: If the only button offered is Resubscribe, the subscription is already set to expire.
      - text: Note the expiry date shown under the Apple Music entry.
    noticePeriodDays: 0
    refundPolicy: >-
      Apple does not prorate the remainder of a paid period; streaming continues until the
      expiry date shown in Subscriptions.
    gotchas:
      - An Apple One bundle covers Apple Music, and no separate Apple Music row appears while the bundle is active; the bundle is the thing to cancel.
      - Songs added to the library from the Apple Music catalogue stop playing when the subscription ends, and only purchased or uploaded tracks remain.
      - A free trial that came with headphones or a new device converts to a paid month automatically unless it is cancelled in Subscriptions.
      - Cancelling on one device applies to the Apple Account, not the device, so a family member's access ends at the same time.
    evidenceHint: Screenshot the Subscriptions screen showing Apple Music expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: direct
    method: account_settings
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: With no Apple device to hand, open apps.apple.com/account/subscriptions in a browser and sign in with the Apple Account that pays for the subscription.
      - text: Find Apple Music in the list and choose Cancel Subscription.
      - text: Confirm, then check the entry shows an expiry date rather than a renewal date.
    noticePeriodDays: 0
    gotchas:
      - Signing in with the wrong Apple Account shows an empty list rather than an error, which reads as though nothing is being charged.
      - An Apple Music subscription started on an Android phone is still billed by Apple and is managed in this same list, not in Google Play.
    evidenceHint: Screenshot the subscription page showing Apple Music expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"
