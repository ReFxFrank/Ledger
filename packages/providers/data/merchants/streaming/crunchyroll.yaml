slug: crunchyroll
name: Crunchyroll
legalName: Crunchyroll, LLC
category: streaming_video
domains:
  - crunchyroll.com
aliases:
  - Crunchyroll Premium
  - Crunchyroll Mega Fan
  - Crunchyroll Fan
  - Funimation
descriptorPatterns:
  - CRUNCHYROLL
  - CRUNCHYROLL.COM
  - CRUNCHYROLL LLC
  - FUNIMATION
typicalIntervals:
  - unit: month
    count: 1
  - unit: year
    count: 1
notes: >-
  Funimation accounts were folded into Crunchyroll in 2024, and old Funimation descriptors still
  appear on statements. Mega Fan and Ultimate Fan are sold as annual plans at a discount, so a
  single yearly Crunchyroll charge is a live subscription rather than a store purchase.
playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    cancelUrl: https://www.crunchyroll.com/account/membership
    steps:
      - text: Sign in at crunchyroll.com in a browser and open the profile icon at the top right, then Settings.
        detail: The phone and TV apps have no membership screen; this only works in a browser.
      - text: Open Membership Status and choose Cancel Membership.
        detail: >-
          If the page says the membership is billed through Apple, Google Play, Amazon or Roku,
          it cannot be cancelled here and the store has to be used instead.
      - text: Pick a reason, then choose Yes, Cancel My Membership on the last screen.
        warning: The offer screen before it proposes a cheaper tier or a free month; both keep the membership alive.
      - text: Check Membership Status now shows the date the membership ends and keep the confirmation email.
    noticePeriodDays: 0
    refundPolicy: >-
      Crunchyroll does not prorate the remainder of a paid month or year; premium access,
      offline viewing and the store discount continue to the end of the paid period.
    retentionOfferNotes: >-
      A downgrade to the cheapest Fan tier and a discounted month are offered before the final
      confirmation.
    gotchas:
      - An annual Mega Fan or Ultimate Fan plan cancelled mid-term keeps running, and stays paid for, until the anniversary date.
      - Offline downloads stop playing when the membership ends.
      - The Crunchyroll Store and Crunchyroll Game Vault bill separately from the membership.
    evidenceHint: Screenshot the Membership Status page showing the end date, and keep the confirmation email.
    sourceUrl: https://help.crunchyroll.com/hc/en-us/articles/206136036-How-do-I-cancel-my-membership
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap Crunchyroll.
        detail: On a Mac, open App Store, click your name at the bottom left, then Account Settings, then Manage next to Subscriptions.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
      - text: Note the expiry date shown under the Crunchyroll entry.
    noticePeriodDays: 0
    gotchas:
      - crunchyroll.com cannot cancel an Apple-billed membership; Membership Status there names Apple instead of offering a cancel control.
      - Deleting the app does not stop the billing.
    evidenceHint: Screenshot the Subscriptions screen showing Crunchyroll expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: Open the Google Play Store app, tap your profile picture, then Payments and subscriptions, then Subscriptions.
      - text: Tap Crunchyroll, then Cancel subscription, and pick a reason when prompted.
      - text: Tap through to the end until the entry shows an expiry date instead of a renewal date.
    noticePeriodDays: 0
    gotchas:
      - The membership belongs to the Google account that bought it, which may not be the profile signed in on the phone today.
      - Uninstalling the app leaves the membership running.
    evidenceHint: Screenshot the Play subscriptions entry showing the expiry date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"

  - channel: amazon
    method: app_store
    difficulty: 2
    cancelUrl: https://www.amazon.com/gp/video/settings
    steps:
      - text: Sign in at amazon.com and open Account and Lists, then Memberships and Subscriptions.
      - text: Open Prime Video Channels and find the Crunchyroll row.
        detail: The same list appears in the Prime Video web player under the gear icon, then Channels.
      - text: Choose Cancel Channel and confirm on the End Subscription screen.
      - text: Check the row now shows the date the channel stops rather than a renewal date.
    noticePeriodDays: 0
    gotchas:
      - The Amazon channel gives simulcast access inside Prime Video only; it is a different subscription from a crunchyroll.com membership, and the two can run at once.
      - crunchyroll.com cannot cancel an Amazon-billed channel.
    evidenceHint: Screenshot the Channels page showing Crunchyroll ending on a date.
    sourceUrl: https://www.amazon.com/yourmembershipsandsubscriptions
    lastVerifiedAt: "2026-07-25"

  - channel: roku
    method: app_store
    difficulty: 2
    cancelUrl: https://my.roku.com/account
    steps:
      - text: Sign in at my.roku.com and open Manage your subscriptions.
      - text: Find Crunchyroll in the list and choose Unsubscribe, then confirm.
        detail: >-
          On the device, highlight the Crunchyroll tile on the Roku home screen, press the star
          (Options) button, choose Manage subscription, then Cancel subscription.
      - text: Check the entry now shows the date the subscription ends.
    noticePeriodDays: 0
    gotchas:
      - Removing the channel from the Roku home screen does not cancel the billing.
      - crunchyroll.com cannot cancel a Roku-billed membership.
    evidenceHint: Screenshot the Roku subscriptions page showing Crunchyroll ending on a date.
    sourceUrl: https://support.roku.com/article/208756478
    lastVerifiedAt: "2026-07-25"
