slug: youtube-tv
name: YouTube TV
legalName: Google LLC
category: streaming_video
domains:
  - tv.youtube.com
aliases:
  - YT TV
  - YouTube TV Base Plan
  - YouTube Live TV
descriptorPatterns:
  - YOUTUBE TV
  - YOUTUBETV
  - GOOGLE YOUTUBETV
  - YOUTUBE TV BASE
typicalIntervals:
  - unit: month
    count: 1
notes: >-
  Base plan only bills monthly, but network add-ons and the NFL Sunday Ticket season pass are
  separate charges on the same account, and a season pass can bill once a year. Cancelling the
  base plan does not stop an add-on that is still inside its own term.
playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    cancelUrl: https://tv.youtube.com/settings/membership
    steps:
      - text: Sign in at tv.youtube.com in a browser, click your profile picture, then Settings, then Membership.
      - text: Open the YouTube TV Base Plan row and choose Cancel membership.
        detail: >-
          Add-on networks and any season pass are listed under the base plan as their own rows,
          each with its own Cancel. Cancelling the base plan leaves those rows untouched.
      - text: Choose Continue to cancel, then confirm on the final screen.
        warning: >-
          The step before it offers to pause the membership for up to six months and shows Pause
          as the primary button. A paused membership starts billing again on its own.
      - text: Check the Membership page shows the date access ends and keep the confirmation email.
    noticePeriodDays: 0
    refundPolicy: >-
      Google does not prorate the remainder of a paid month; live channels and the recording
      library stay available until the paid period ends.
    retentionOfferNotes: >-
      A pause of up to six months, and often a discounted month, are offered ahead of the
      cancellation confirmation.
    gotchas:
      - Recordings in the cloud library are removed roughly three weeks after the membership ends, so anything worth keeping has to be watched first.
      - Pausing is offered where cancelling should be, and billing resumes automatically at the end of the pause.
      - Add-on networks and a season pass keep billing after the base plan is cancelled unless each one is cancelled separately.
    evidenceHint: Screenshot the Membership page showing the end date for the base plan and every add-on.
    sourceUrl: https://support.google.com/youtubetv/answer/7068923
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap YouTube TV.
        detail: On a Mac, open App Store, click your name at the bottom left, then Account Settings, then Manage next to Subscriptions.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
      - text: Note the expiry date shown under the YouTube TV entry.
    noticePeriodDays: 0
    gotchas:
      - tv.youtube.com cannot cancel an Apple-billed membership; the Membership page names Apple instead of offering a cancel control.
      - Add-ons bought on the web are billed by Google even when the base plan is billed by Apple, so both places may need checking.
    evidenceHint: Screenshot the Subscriptions screen showing YouTube TV expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: Open the Google Play Store app, tap your profile picture, then Payments and subscriptions, then Subscriptions.
      - text: Tap YouTube TV, then Cancel subscription, and pick a reason when prompted.
      - text: Tap through to the end until the entry shows an expiry date instead of a renewal date.
    noticePeriodDays: 0
    gotchas:
      - The membership belongs to the Google account that bought it, which may not be the profile signed in on the phone today.
      - Uninstalling the app leaves the membership running.
    evidenceHint: Screenshot the Play subscriptions entry showing the expiry date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
