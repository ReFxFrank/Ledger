slug: youtube-premium
name: YouTube Premium
legalName: Google LLC
category: streaming_video
domains:
  - youtube.com
aliases:
  - YouTube Red
  - YouTube Music Premium
  - YT Premium
  - YouTube Premium Family
descriptorPatterns:
  - YOUTUBE PREMIUM
  - YOUTUBEPREMIUM
  - YOUTUBE MUSIC
  - GOOGLE YOUTUBEPREMIUM
typicalIntervals:
  - unit: month
    count: 1
  - unit: year
    count: 1
notes: >-
  YouTube Premium includes YouTube Music Premium, and the two can also be bought separately, so
  a household sometimes pays for both without realising. The price differs by where it was
  bought: an iPhone purchase costs more than the same plan bought in a browser, and it is the
  Apple-billed one that has to be cancelled through Apple.
playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    cancelUrl: https://www.youtube.com/paid_memberships
    steps:
      - text: Sign in at youtube.com in a browser, click your profile picture, then Purchases and memberships.
      - text: Find YouTube Premium and choose Manage membership, then Deactivate.
        detail: >-
          Deactivate is the wording YouTube uses for cancel. If the page says the membership was
          bought through Apple, Google Play or a mobile operator, it cannot be ended here.
      - text: Choose Continue to cancel, then Yes, deactivate on the final screen.
        warning: >-
          The screen before it offers to pause the membership for up to six months and places
          Pause as the primary button. A paused membership resumes billing by itself.
      - text: Check the page now shows the date the membership ends and keep the confirmation email.
    noticePeriodDays: 0
    refundPolicy: >-
      Google does not prorate the remainder of a paid month or year; ad-free playback, downloads
      and background play continue until the paid period ends.
    retentionOfferNotes: >-
      A pause of up to six months, and sometimes a discounted period, are offered before the
      deactivation confirmation is reachable.
    gotchas:
      - Pausing is presented where cancelling should be, and billing restarts automatically when the pause runs out.
      - Downloaded videos stop playing when the membership ends, including on a device left offline.
      - A family plan member cannot cancel; only the family manager's Google account sees the controls.
      - An annual plan cancelled mid-term keeps running, and stays paid for, until the anniversary date.
    evidenceHint: Screenshot the Purchases and memberships page showing the end date.
    sourceUrl: https://support.google.com/youtube/answer/6308278
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap YouTube Premium.
        detail: On a Mac, open App Store, click your name at the bottom left, then Account Settings, then Manage next to Subscriptions.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
      - text: Note the expiry date shown under the YouTube entry.
    noticePeriodDays: 0
    gotchas:
      - youtube.com cannot cancel an Apple-billed membership; the memberships page names Apple and offers no Deactivate button.
      - The Apple-billed price is higher than the price on youtube.com, so resubscribing later in a browser is usually cheaper.
      - Deleting the YouTube app does not stop the billing.
    evidenceHint: Screenshot the Subscriptions screen showing YouTube Premium expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: Open the Google Play Store app, tap your profile picture, then Payments and subscriptions, then Subscriptions.
      - text: Tap YouTube Premium, then Cancel subscription, and pick a reason when prompted.
      - text: Tap through to the end until the entry shows an expiry date instead of a renewal date.
    noticePeriodDays: 0
    gotchas:
      - The membership belongs to the Google account that bought it, which may not be the profile signed in on the phone today.
      - A membership bought on Android also appears at youtube.com, and cancelling it in either place refers back to Google Play.
    evidenceHint: Screenshot the Play subscriptions entry showing the expiry date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
