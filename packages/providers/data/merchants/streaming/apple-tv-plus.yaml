slug: apple-tv-plus
name: Apple TV+
legalName: Apple Inc.
category: streaming_video
domains:
  - tv.apple.com
aliases:
  - Apple TV Plus
  - Apple TV+
  - AppleTV Plus
descriptorPatterns:
  - APPLE TV PLUS
  - APPLE TV+
  - APPLETV PLUS
  - APPLE TV CHANNEL
typicalIntervals:
  - unit: month
    count: 1
  - unit: year
    count: 1
notes: >-
  Apple prints one descriptor, APPLE.COM/BILL, for every Apple subscription a person holds, so a
  statement line cannot be attributed to Apple TV+ rather than iCloud, Apple Music or an app
  bought through the App Store. That fragment is deliberately claimed by no merchant in this
  dataset; matching it to one service would be a guess. The subscription list on the device is
  the only reliable breakdown, which is worth saying to the user directly.
playbooks:
  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the very top of the list.
      - text: Tap Subscriptions, then tap Apple TV+.
        detail: >-
          On a Mac, open App Store, click your name at the bottom left, then Account Settings,
          then Manage next to Subscriptions. On an Apple TV, use Settings, then Users and
          Accounts, then your account, then Subscriptions.
      - text: Tap Cancel Subscription and confirm on the sheet that appears.
        detail: If the only button offered is Resubscribe, the subscription is already set to expire.
      - text: Note the expiry date shown under the Apple TV+ entry.
    noticePeriodDays: 0
    refundPolicy: >-
      Apple does not prorate the remainder of a paid period; the Apple TV+ library stays
      available until the expiry date shown in Subscriptions.
    gotchas:
      - An Apple One bundle covers Apple TV+, and the individual Apple TV+ row will not appear while the bundle is active; the bundle has to be cancelled instead.
      - Buying an Apple device often starts a free Apple TV+ period that converts to a paid month automatically unless it is cancelled in Subscriptions first.
      - Deleting the Apple TV app changes nothing about the billing.
    evidenceHint: Screenshot the Subscriptions screen showing Apple TV+ expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: direct
    method: account_settings
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On a computer with no Apple device to hand, open apps.apple.com/account/subscriptions and sign in with the Apple Account that pays for the subscription.
      - text: Find Apple TV+ in the list and choose Cancel Subscription.
      - text: Confirm, then check the entry shows an expiry date rather than a renewal date.
    noticePeriodDays: 0
    gotchas:
      - Signing in with a different Apple Account shows an empty list rather than an error, which reads as though the subscription is already gone.
      - Subscribing at tv.apple.com still bills through the Apple Account, so this is the same subscription seen from the web instead of a separate one.
    evidenceHint: Screenshot the subscription page showing Apple TV+ expiring on a date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: amazon
    method: app_store
    difficulty: 2
    cancelUrl: https://www.amazon.com/gp/video/settings
    steps:
      - text: Sign in at amazon.com and open Account and Lists, then Memberships and Subscriptions.
      - text: Open Prime Video Channels and find the Apple TV+ row.
        detail: The same list appears in the Prime Video web player under the gear icon, then Channels.
      - text: Choose Cancel Channel and confirm on the End Subscription screen.
      - text: Check the row now shows the date the channel stops rather than a renewal date.
    noticePeriodDays: 0
    gotchas:
      - A subscription bought as a Prime Video Channel is billed by Amazon, and it will not appear in the Subscriptions list on an iPhone at all.
      - Someone can hold both an Amazon channel and an Apple-billed subscription without noticing, because the Apple TV app shows the content either way.
    evidenceHint: Screenshot the Channels page showing Apple TV+ ending on a date.
    sourceUrl: https://www.amazon.com/yourmembershipsandsubscriptions
    lastVerifiedAt: "2026-07-25"

  - channel: roku
    method: app_store
    difficulty: 2
    cancelUrl: https://my.roku.com/account
    steps:
      - text: Sign in at my.roku.com and open Manage your subscriptions.
      - text: Find Apple TV+ in the list and choose Unsubscribe, then confirm.
        detail: >-
          On the device, highlight the Apple TV tile on the Roku home screen, press the star
          (Options) button, choose Manage subscription, then Cancel subscription.
      - text: Check the entry now shows the date the subscription ends.
    noticePeriodDays: 0
    gotchas:
      - Removing the Apple TV channel from the Roku home screen does not cancel the billing.
      - This subscription is invisible in the Subscriptions list on an iPhone, so it is easy to conclude wrongly that nothing is running.
    evidenceHint: Screenshot the Roku subscriptions page showing Apple TV+ ending on a date.
    sourceUrl: https://support.roku.com/article/208756478
    lastVerifiedAt: "2026-07-25"
