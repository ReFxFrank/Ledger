slug: skillshare
name: Skillshare
legalName: Skillshare, Inc.
category: education
domains:
  - skillshare.com
aliases:
  - Skillshare Premium
  - Skillshare Membership
descriptorPatterns:
  - SKILLSHARE
  - SKILLSHARE.COM
  - SKILLSHARE INC
  - SKILLSHARE MEMBERSHIP
typicalIntervals:
  - unit: month
    count: 1
  - unit: year
    count: 1

notes: >-
  Skillshare is heavily promoted through free trials attached to creator sponsorships, and the
  trial converts to a full annual membership automatically. The annual price is taken as one
  payment, so the charge people query is usually the trial converting rather than a renewal. The
  refund window after a trial charge is short and counted in hours, not days.

playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    cancelUrl: https://www.skillshare.com/settings/payments
    steps:
      - text: >-
          Sign in at skillshare.com and open Account settings from the profile menu, then
          Membership & Payments.
      - text: >-
          Check the renewal date shown there first — if this is a trial, the conversion charge is
          on that date.
      - text: Choose Cancel membership and follow the prompts through to the last screen.
        warning: >-
          The prompts include offers and a survey; the membership is only cancelled once the page
          confirms it and shows an end date.
      - text: >-
          Confirm the page now says the membership ends on a date rather than renews, and keep the
          confirmation email.
      - text: >-
          If the page says the membership is managed by the App Store or Google Play, use the
          matching store playbook — Skillshare cannot stop those charges.
      - text: >-
          If a trial has already been charged, contact Skillshare support quickly; the goodwill
          refund window is measured in hours from the charge.
    noticePeriodDays: 0
    refundPolicy: >-
      Cancelling stops future billing and does not by itself return money already taken. Skillshare
      offers a one-time refund on a 7-day trial charge if support is contacted within 48 hours and
      the account has not been used since.
    retentionOfferNotes: >-
      The cancel flow offers a discounted rate, a month free, or a pause before the final
      confirmation screen.
    gotchas:
      - >-
        A free trial converts into a paid annual membership automatically at the end of the trial
        unless it is cancelled first.
      - >-
        Uninstalling the app cancels nothing; a store-billed membership has to be cancelled in the
        store.
      - >-
        Cancelling does not trigger a refund of the current term — the membership simply runs to
        its end date.
      - >-
        The annual plan is charged as a single payment, so a cancellation mid-term stops the
        renewal rather than the current year.
    evidenceHint: >-
      Screenshot the Membership & Payments page showing the membership ending on a date, plus the
      cancellation confirmation email.
    sourceUrl: https://help.skillshare.com/hc/en-us/articles/115001701651-How-do-I-cancel-my-Skillshare-subscription
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the top of the screen.
      - text: Tap Subscriptions, then tap Skillshare in the list.
      - text: Tap Cancel Subscription and confirm.
        detail: >-
          If Skillshare is not listed, the membership was started on the website and is cancelled
          in Membership & Payments there.
    noticePeriodDays: 0
    gotchas:
      - Deleting the Skillshare app does not stop an App Store subscription.
      - >-
        Skillshare cannot cancel an Apple-billed membership on your behalf; the App Store is the
        only place it can be stopped.
    evidenceHint: Screenshot the App Store Subscriptions screen showing the expiry date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: Open the Google Play Store app and tap your profile icon in the top right.
      - text: Tap Payments & subscriptions, then Subscriptions, and select Skillshare.
      - text: Tap Cancel subscription, choose a reason, and confirm on the final screen.
    noticePeriodDays: 0
    gotchas:
      - Uninstalling the app leaves the Google Play subscription running.
      - A Play-billed membership cannot be cancelled from skillshare.com.
    evidenceHint: Screenshot the Play Subscriptions screen showing the cancellation and end date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
