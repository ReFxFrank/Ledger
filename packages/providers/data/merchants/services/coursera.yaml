slug: coursera
name: Coursera
legalName: Coursera, Inc.
category: education
domains:
  - coursera.org
aliases:
  - Coursera Plus
  - Coursera Subscription
descriptorPatterns:
  - COURSERA
  - COURSERA.ORG
  - COURSERA PLUS
  - COURSERA INC
typicalIntervals:
  - unit: month
    count: 1
  - unit: year
    count: 1

notes: >-
  Coursera bills three different things that all say COURSERA on a statement: Coursera Plus
  (monthly or annual, covers most of the catalogue), individual Specialization subscriptions that
  keep charging until the certificate is earned or the subscription is cancelled, and one-off
  course or degree payments. A recurring charge that survives cancelling Coursera Plus is almost
  always a Specialization subscription that was never touched.

playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    cancelUrl: https://www.coursera.org/my-purchases
    steps:
      - text: >-
          Sign in at coursera.org and open My Purchases from the profile menu, or go straight to
          coursera.org/my-purchases.
      - text: >-
          Look at the whole list, not just the top entry. Coursera Plus and each Specialization
          subscription are billed separately and each has its own renewal date.
      - text: >-
          Next to the subscription you are ending, choose Manage subscription, then Cancel
          subscription.
      - text: >-
          Work through the confirmation screens until the entry shows an end date instead of a
          renewal date.
        warning: >-
          Leaving before the final screen leaves the subscription live; the interim screens offer
          reasons and alternatives rather than confirming.
      - text: >-
          Repeat for every other active subscription in the list, then keep the confirmation email
          Coursera sends.
    noticePeriodDays: 0
    refundPolicy: >-
      Access runs to the end of the period already paid for. Annual Coursera Plus carries a
      14-day money-back window from the purchase date; after that the term runs out rather than
      being refunded.
    retentionOfferNotes: >-
      The cancel flow offers a pause, a switch from annual to monthly, or a discounted renewal
      before the final confirmation. Pausing keeps the subscription and it resumes on its own.
    gotchas:
      - >-
        Cancelling Coursera Plus does not stop separate Specialization subscriptions, which keep
        charging monthly under the same descriptor.
      - >-
        A free trial converts to a paid subscription automatically at the end of the trial unless
        it is cancelled inside the trial window.
      - >-
        Annual Coursera Plus takes twelve months up front; cancelling later stops the renewal, not
        the current year.
      - >-
        Course progress on unfinished courses is saved but graded assignments and certificates
        stop being available when the subscription lapses.
      - >-
        A subscription bought inside the Coursera mobile app is billed by the App Store or Google
        Play and will not appear under My Purchases.
    evidenceHint: >-
      Screenshot My Purchases showing each subscription as ending, with the date, and keep the
      cancellation confirmation email.
    sourceUrl: https://www.coursera.support/s/article/learner-000001189
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the top of the screen.
      - text: Tap Subscriptions, then tap Coursera in the list.
      - text: Tap Cancel Subscription and confirm.
        detail: >-
          If Coursera is not listed here, the subscription was bought on the web and lives under
          My Purchases at coursera.org instead.
    noticePeriodDays: 0
    gotchas:
      - Deleting the Coursera app does not stop an App Store subscription.
      - >-
        An Apple-billed Coursera subscription does not appear under My Purchases on the website
        and cannot be cancelled there.
    evidenceHint: Screenshot the App Store Subscriptions screen showing the expiry date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: Open the Google Play Store app and tap your profile icon in the top right.
      - text: Tap Payments & subscriptions, then Subscriptions, and select Coursera.
      - text: Tap Cancel subscription, choose a reason, and confirm on the final screen.
    noticePeriodDays: 0
    gotchas:
      - Uninstalling the app leaves the Google Play subscription running.
      - A Play-billed subscription is not listed under My Purchases on coursera.org.
    evidenceHint: Screenshot the Play Subscriptions screen showing the cancellation and end date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
