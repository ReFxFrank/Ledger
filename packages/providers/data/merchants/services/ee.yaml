slug: ee
name: EE
legalName: EE Limited
category: telecom
domains:
  - ee.co.uk
aliases:
  - EE Mobile
  - EE Broadband
  - Everything Everywhere
descriptorPatterns:
  - EE LIMITED
  - EE LTD
  - EE MOBILE
  - EE BROADBAND
  - EVERYTHING EVERYWHERE
typicalIntervals:
  - unit: month
    count: 1

notes: >-
  EE charges the 30-day notice period as a "Remaining Contract Charge" on the final bill, so a
  cancellation always costs one more month than people expect. Switching with a PAC avoids that
  line because the transfer itself ends the agreement.

playbooks:
  - channel: direct
    method: phone
    difficulty: 4
    phone: "0800 956 6000"
    hours: Mon-Fri 8am-8pm, Sat 8am-6pm, Sun 9am-6pm UK time
    steps:
      - text: >-
          Decide whether the number is moving. To keep it, request a PAC — text PAC to 65075 or
          request it in the EE app; the code arrives by text almost immediately.
        detail: >-
          The PAC is valid for 30 days. Giving it to the new network ends the EE agreement at the
          switch; if nobody uses it, the EE plan keeps running and keeps billing.
      - text: >-
          To leave without keeping the number, text STAC to 75075, or call 150 from an EE phone
          (0800 956 6000 from any other line) and ask to cancel.
      - text: >-
          For EE broadband, call and give 30 days' notice. Ask for the exact date the line stops
          and the amount of the Remaining Contract Charge.
      - text: >-
          Ask for a cancellation reference and for written confirmation of the end date by email
          or post.
      - text: >-
          Leave the Direct Debit running until the final bill has cleared, then return any loaned
          router in the bag EE sends.
        warning: >-
          Cancelling the Direct Debit early leaves an unpaid final balance against the account.
    noticePeriodDays: 30
    refundPolicy: >-
      The 30 days of notice are charged in full and appear on the final bill as the Remaining
      Contract Charge. Leaving inside the minimum term adds an early exit charge on top.
    retentionOfferNotes: >-
      The cancellation line is staffed by retentions; expect a discounted tariff, extra data, or a
      handset upgrade. Accepting starts a new minimum term.
    gotchas:
      - >-
        At least 30 days' notice is required even when the minimum term has already ended, and
        those 30 days are billed.
      - >-
        A PAC on its own changes nothing — the agreement ends only when the new network uses the
        code within its 30-day life.
      - >-
        Leaving inside the minimum term adds an early exit charge covering the remaining months;
        ask for the figure before agreeing.
      - >-
        EE mobile, EE broadband and EE TV are separate agreements — each needs its own notice.
      - >-
        Add-ons and insurance (EE Full Works extras, phone care) can keep billing after the plan
        ends unless they are cancelled separately.
    letterTemplate: |
      {{fullName}}
      {{postalAddress}}

      {{date}}

      EE Limited
      6 Camberwell Way
      Sunderland, Tyne and Wear SR3 3XN

      Account / mobile number: {{accountReference}}

      Dear EE,

      I am writing to give notice to end my EE agreement on the account above. Please treat this
      letter as my 30 days' notice, running from the date you receive it.

      Please confirm to me in writing at the address above:

        - the date my service will end,
        - the final amount due, including any Remaining Contract Charge or early exit charge,
        - the date that amount will be collected,
        - that no further payments will be taken by Direct Debit after that date.

      Please also send me written confirmation once the account has been closed.

      Yours faithfully,

      {{fullName}}
    evidenceHint: >-
      Keep the PAC or STAC text, the cancellation reference from the call, and the final bill
      showing the end date and the Remaining Contract Charge.
    sourceUrl: https://ee.co.uk/help/profile/leaving-ee/cancel-my-contract-with-ee
    lastVerifiedAt: "2026-07-25"
