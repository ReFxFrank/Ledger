slug: rosetta-stone
name: Rosetta Stone
legalName: Rosetta Stone Ltd.
category: education
domains:
  - rosettastone.com
aliases:
  - Rosetta Stone Sapphire
  - RosettaStone
descriptorPatterns:
  - ROSETTA STONE
  - ROSETTASTONE.COM
  - ROSETTA STONE LTD
  - ROSETTA STONE INC
typicalIntervals:
  - unit: month
    count: 1
  - unit: month
    count: 3
  - unit: year
    count: 1

notes: >-
  Rosetta Stone sells both auto-renewing subscriptions and a one-time "lifetime" purchase, and the
  two look similar on a statement until the renewal arrives a year later. The action on the
  account is Turn Off Auto Renew rather than a cancel button, which is easy to miss when looking
  for the word "cancel". The newer Sapphire product uses a different account layout from the
  older one, so both routes are worth trying.

playbooks:
  - channel: direct
    method: account_settings
    difficulty: 2
    cancelUrl: https://www.rosettastone.com/login
    steps:
      - text: >-
          Sign in on the Rosetta Stone website in a browser; the mobile apps do not carry the
          auto-renew control for a web-bought subscription.
      - text: >-
          On the older layout, click your current learning language in the top toolbar and choose
          My Account, then look under Your products.
      - text: >-
          Choose Turn Off Auto Renew next to the subscription, and confirm.
        detail: >-
          There is no button labelled "cancel" here. Turning off auto-renew is the cancellation —
          access continues to the end of the term already paid for.
      - text: >-
          On Sapphire, click the profile icon in the top right, open Account settings, then Manage
          subscription, then Cancel subscription.
      - text: >-
          Confirm the account now shows the subscription expiring on a date rather than renewing,
          and keep the confirmation email.
      - text: >-
          If neither route shows the subscription, it was bought in an app store — use the Apple
          or Google playbook.
      - text: >-
          If the control is missing altogether, raise a cancellation request through Rosetta Stone
          support and keep the ticket reference.
    noticePeriodDays: 0
    refundPolicy: >-
      Access runs to the end of the term already paid for. Rosetta Stone describes a 30-day window
      after an automatic renewal in which the renewal term can be returned.
    retentionOfferNotes: >-
      The flow offers a discounted renewal or a shorter plan before confirming, and support will
      often propose extending the term instead of stopping it.
    gotchas:
      - >-
        The control is called Turn Off Auto Renew, not Cancel — people look for a cancel button,
        do not find one, and assume there is none.
      - >-
        A lifetime purchase is a one-off and has no auto-renew; a recurring charge means a
        subscription is also active on the account.
      - >-
        Uninstalling the app or letting the account lapse does not stop an auto-renewing
        subscription.
      - >-
        The renewal on an annual plan is taken twelve months after purchase in one payment, which
        is long enough for the original signup to be forgotten.
      - >-
        A subscription bought through the App Store or Google Play is not shown in the Rosetta
        Stone account and cannot be cancelled there.
    evidenceHint: >-
      Screenshot the account page showing auto-renew off and the expiry date, and keep the
      confirmation email or the support ticket reference.
    sourceUrl: https://support.rosettastone.com/s/article/Cancel-your-Subscription
    lastVerifiedAt: "2026-07-25"

  - channel: apple
    method: app_store
    difficulty: 1
    cancelUrl: https://apps.apple.com/account/subscriptions
    steps:
      - text: On iPhone or iPad, open Settings and tap your name at the top of the screen.
      - text: Tap Subscriptions, then tap Rosetta Stone in the list.
      - text: Tap Cancel Subscription and confirm.
        detail: >-
          If Rosetta Stone is not listed, the subscription was bought on the website and the
          direct playbook applies.
    noticePeriodDays: 0
    gotchas:
      - Deleting the Rosetta Stone app does not stop an App Store subscription.
      - >-
        Rosetta Stone support cannot stop an Apple-billed subscription; it has to be cancelled in
        Apple's subscription settings.
    evidenceHint: Screenshot the App Store Subscriptions screen showing the expiry date.
    sourceUrl: https://support.apple.com/en-us/118428
    lastVerifiedAt: "2026-07-25"

  - channel: google
    method: app_store
    difficulty: 1
    cancelUrl: https://play.google.com/store/account/subscriptions
    steps:
      - text: Open the Google Play Store app and tap your profile icon in the top right.
      - text: Tap Payments & subscriptions, then Subscriptions, and select Rosetta Stone.
      - text: Tap Cancel subscription, choose a reason, and confirm on the final screen.
    noticePeriodDays: 0
    gotchas:
      - Uninstalling the app leaves the Google Play subscription running.
      - A Play-billed subscription does not appear in the Rosetta Stone account pages.
    evidenceHint: Screenshot the Play Subscriptions screen showing the cancellation and end date.
    sourceUrl: https://support.google.com/googleplay/answer/7018481
    lastVerifiedAt: "2026-07-25"
