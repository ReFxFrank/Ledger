typicalIntervals:
  - unit: month
    count: 1

notes: >-
  Three's final bill can arrive up to 38 days after the account closes, which is long enough that
  people assume the cancellation failed and call again. Treat a charge inside that window as the
  closing bill until the account page says otherwise.

playbooks:
  - channel: direct
    method: phone
    difficulty: 4
    phone: "0333 338 1001"
    hours: Mon-Fri 8am-8pm, Sat-Sun 9am-6pm UK time
    steps:
      - text: >-
          Decide whether you are keeping the number. To keep it, text PAC to 65075; to leave
          without it, text STAC to 75075. The code arrives by text within minutes.
        detail: >-
          Handing a PAC or STAC to the new network ends the Three agreement at the switch. The
          codes last 30 days; unused, nothing happens and billing continues.
      - text: >-
          To cancel without switching, call 333 from a Three phone or 0333 338 1001 from any
          line, or open Live Chat from three.co.uk/support/cancel-contract.
      - text: >-
          Have your mobile number and account password ready — Three will not process a
          cancellation without passing security.
      - text: >-
          Say clearly that you are giving 30 days' notice to cancel and ask for the date the
          service will stop.
      - text: Ask for a cancellation reference number and note the adviser's name.
      - text: >-
          Leave the Direct Debit in place until the final bill arrives; it can take up to 38 days
          after closure.
        warning: >-
          Cancelling the Direct Debit early leaves an unpaid balance that can be passed to
          collections.
    noticePeriodDays: 30
    refundPolicy: >-
      The 30-day notice period is charged. Cancelling inside the minimum term adds an early
      termination fee covering the remaining months of the agreement.
    retentionOfferNotes: >-
      The cancellation line is a retentions desk. Expect a discounted plan or extra data; taking
      one normally restarts the minimum term.
    gotchas:
      - 30 days' notice is required even after the minimum term has ended, and that month is billed.
      - >-
        A PAC or STAC only ends the agreement once the new network actually uses it, within the
        code's 30-day life.
      - The final bill can arrive up to 38 days after the account closes — do not read it as a failed cancellation.
      - >-
        Three Home Broadband and 5G Hub contracts are cancelled separately from mobile and have
        their own notice.
      - >-
        Cancelling inside the minimum term triggers an early termination fee; ask for the exact
        figure before you agree to close.
    letterTemplate: |
      {{fullName}}
      {{postalAddress}}

      {{date}}

      Three Customer Services
      Hutchison 3G UK Ltd
      PO Box 333, Glasgow G2 9AG

      Account / mobile number: {{accountReference}}

      Dear Three,

      I am writing to give notice to end my Three agreement on the account above. Please treat
      this letter as my 30 days' notice, running from the date you receive it.

      Please confirm to me in writing at the address above:

        - the date my service will end,
        - the final amount due, including any early termination fee,
        - the date that amount will be collected,
        - that no further payments will be taken by Direct Debit after that date.

      Please also send written confirmation once my account has been closed.

      Yours faithfully,

      {{fullName}}
    evidenceHint: >-
      Keep the PAC or STAC text message, the cancellation reference and adviser name, and the
      final bill showing the closing date.
    sourceUrl: https://www.three.co.uk/support/cancel-contract
    lastVerifiedAt: "2026-07-25"
